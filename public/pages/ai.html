<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VOID | BOT</title>
    <link rel="shortcut icon" href="/assets/img/fav.png" type="image/x-icon">
    <link rel="stylesheet" href="/assets/css/font.css?v=2">
    <link rel="stylesheet" id="csslink" href="/assets/css/colors/default.css">
    <link rel="stylesheet" href="/assets/css/index.css">
    <link rel="stylesheet" href="/assets/icons/css/all-pro.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/markdown-it-texmath/css/texmath.css">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: var(--bg); color: var(--text); display: flex; height: 100vh; overflow: hidden; }
        body:not(code) { font-family: "figtree normal", "Inter", sans-serif; }
        code>*, code>.hljs-type, code>.hljs-function, code>.hljs-title, code>.hljs-built_in, code>.hljs-number, code>.hljs-string {
            font-family: "Roboto Mono", monospace !important;
        }
        #sidebar { width: 250px; height: 100vh; background: var(--bg); border-right: 1px solid var(--border-3); border-left: 1px solid var(--border-3); display: flex; flex-direction: column; flex-shrink: 0; transition: transform 0.3s ease, width 0.3s ease; position: relative; z-index: 30; }
        #sidebar-header { padding: 13px 12px 12px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border-3); flex-shrink: 0; }
        .sidebar-logo { font-size: 15px; font-weight: 700; gap: 5px; display: flex; align-items: center; color: var(--bright-text); }
        #new-chat-btn { width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--border-2); background: transparent; color: var(--text-2); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 15px; transition: all 0.2s ease; flex-shrink: 0; }
        #new-chat-btn:hover { background: var(--border-3); color: var(--bright-text); }
        #sidebar-search { padding: 10px 14px; flex-shrink: 0; }
        #sidebar-search input { width: 100%; background: var(--bg-3); border: 1px solid var(--border-3); border-radius: 10px; color: var(--text); font-size: 12px; padding: 7px 10px 7px 30px; outline: none; transition: border-color 0.2s ease; font-family: inherit; }
        #sidebar-search input::placeholder { color: var(--border); }
        #sidebar-search input:focus { border-color: var(--border-2); }
        .sidebar-search-wrap { position: relative; }
        .sidebar-search-wrap i { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--text-2); font-size: 12px; pointer-events: none; }
        #chats-list { flex: 1; overflow-y: auto; padding: 4px 8px; scrollbar-width: thin; scrollbar-color: var(--border-2) transparent; }
        #chats-list::-webkit-scrollbar { width: 4px; }
        #chats-list::-webkit-scrollbar-track { background: transparent; }
        #chats-list::-webkit-scrollbar-thumb { background: var(--border-2); border-radius: 4px; }
        .chats-section-label { font-size: 10px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; color: var(--text-2); padding: 12px 6px 6px; opacity: 0.6; }
        .chat-item { display: flex; margin-bottom: 2.5px; align-items: center; gap: 8px; height: 35px; padding: 8px 10px; border-radius: 10px; cursor: pointer; transition: background 0.15s ease; position: relative; }
        .chat-item:hover { background: var(--border-4); }
        .chat-item.active { background: var(--border-3); }
        .chat-item.active .chat-item-title { color: var(--bright-text); }
        .chat-item-icon { font-size: 13px; color: var(--text-2); flex-shrink: 0; width: 16px; margin: 0; text-align: center; }
        .chat-item-title { font-size: 13px; color: var(--text); flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.4; }
        .chat-item-actions { display: none; gap: 2px; flex-shrink: 0; }
        .chat-item:hover .chat-item-actions { display: flex; }
        .chat-action-btn { width: 22px; height: 22px; border-radius: 6px; border: none; background: transparent; color: var(--text-2); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 11px; transition: all 0.15s ease; }
        .chat-action-btn:hover { background: var(--border-2); color: var(--bright-text); }
        .chat-action-btn.delete:hover { color: #ff4444; }
        #sidebar-bottom { padding: 12px; border-top: 1px solid var(--border-3); flex-shrink: 0; }
        .model-selector-bar { display: flex; align-items: center; gap: 8px; padding: 8px 10px; background: var(--bg-3); border: 1px solid var(--border-3); border-radius: 10px; cursor: pointer; transition: background 0.15s ease; position: relative; }
        .model-selector-bar:hover { background: var(--bg-4); }
        .model-selector-bar i { font-size: 14px; color: var(--text-2); }
        .model-selector-label { font-size: 12px; color: var(--text-2); flex: 1; }
        .model-selector-value { font-size: 12px; color: var(--text); font-weight: 500; }
        .model-selector-arrow { font-size: 11px; color: var(--text-2); }
        .model-popover { position: absolute; bottom: calc(100% + 8px); left: 0; right: 0; background: var(--bg-3); border: 1px solid var(--border-2); border-radius: 12px; padding: 4px; opacity: 0; visibility: hidden; transform: translateY(6px); transition: all 0.2s ease; z-index: 50; }
        .model-popover.open { opacity: 1; visibility: visible; transform: translateY(0); }
        .model-option { padding: 9px 12px; border-radius: 8px; cursor: pointer; font-size: 13px; color: var(--text); transition: background 0.15s ease; display: flex; align-items: center; justify-content: space-between; }
        .model-option:hover { background: var(--border-3); }
        .model-option.selected { color: var(--bright-text); }
        .model-option.selected::after { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); display: block; }
        #main { flex: 1; display: flex; flex-direction: column; height: 100vh; overflow: hidden; position: relative; }
        #chat-header { display: flex; align-items: center; justify-content: space-between; padding: 0 20px; height: 56px; border-bottom: 1px solid var(--border-3); flex-shrink: 0; background: var(--bg); }
        .chat-header-left { display: flex; align-items: center; gap: 10px; }
        .chat-header-title { font-size: 14px; color: var(--text); font-weight: 500; max-width: 300px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .header-icon-btn { width: 32px; height: 32px; border-radius: 8px; border: none; background: transparent; color: var(--text-2); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 16px; transition: all 0.15s ease; }
        .header-icon-btn:hover { background: var(--border-3); color: var(--bright-text); }
        #sidebar-toggle { display: none; }
        .messages-container { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 24px 0 200px; scrollbar-width: thin; scrollbar-color: var(--border-2) transparent; }
        .messages-container::-webkit-scrollbar { width: 4px; }
        .messages-container::-webkit-scrollbar-track { background: transparent; }
        .messages-container::-webkit-scrollbar-thumb { background: var(--border-2); border-radius: 4px; }
        .messages-inner { max-width: 680px; margin: 0 auto; padding: 0 20px; width: 100%; }
        #start-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 60vh; gap: 32px; text-align: center; padding: 40px 20px; }
        .start-title { font-size: 28px; font-weight: 600; color: var(--bright-text); letter-spacing: -0.5px; line-height: 1.2; }
        .start-suggestions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; width: 100%; max-width: 500px; }
        .suggestion-chip { background: var(--bg-3); border: 1px solid var(--border-3); border-radius: 12px; padding: 12px 14px; text-align: left; cursor: pointer; transition: all 0.2s ease; font-size: 13px; color: var(--text); font-family: inherit; line-height: 1.4; }
        .suggestion-chip:hover { background: var(--bg-4); border-color: var(--border-2); color: var(--bright-text); }
        .suggestion-chip .chip-icon { font-size: 20px; margin-bottom: 6px; display: block; }
        .suggestion-chip .chip-text { font-size: 12px; color: var(--text-2); display: block; margin-top: 2px; }
        .gone { display: none !important; }
        .message { display: flex; margin-bottom: 6px; }
        .message.user-message { justify-content: flex-end; }
        .message.ai-message { justify-content: flex-start; }
        .message-content { line-height: 1.6; font-size: 14.5px; overflow-wrap: break-word; word-break: break-word; }
        .user-message .message-content { background: var(--bg-3); border: 1px solid var(--border-3); border-radius: 18px 18px 4px 18px; padding: 10px 14px; max-width: 75%; color: var(--bright-text); opacity: 0; transition: opacity 0.25s ease; }
        .user-message .message-content.show { opacity: 1; }
        .ai-message .message-content { background: transparent; max-width: 100%; width: 100%; padding: 4px 0; color: var(--text); }
        .user-image-preview { max-width: 260px; max-height: 200px; border-radius: 12px; border: 1px solid var(--border-2); display: block; margin-bottom: 6px; object-fit: cover; }
        .message-content p { color: var(--text); margin: 0 0 12px; line-height: 1.7; }
        .message-content p:last-child { margin-bottom: 0; }
        .message-content h1 { font-size: 1.6em; font-weight: 700; color: var(--bright-text); border-bottom: 1px solid var(--border-3); padding-bottom: 8px; margin: 20px 0 12px; }
        .message-content h2 { font-size: 1.3em; font-weight: 600; color: var(--bright-text); margin: 18px 0 10px; }
        .message-content h3 { font-size: 1.1em; font-weight: 600; color: var(--text); margin: 14px 0 8px; }
        .message-content ul, .message-content ol { padding-left: 22px; margin: 10px 0; }
        .message-content li { margin-bottom: 6px; line-height: 1.6; color: var(--text); }
        .message-content blockquote { margin: 16px 0; padding: 12px 20px; background: var(--border-4); border-left: 3px solid var(--accent); border-radius: 15px; color: var(--text-2); font-style: italic; }
        .message-content hr { border: none; height: 1px; background: var(--border-3); margin: 24px 0; }
        .message-content code:not(pre code) { background: var(--bg-4); color: #e1d5a1; padding: 2px 6px; border-radius: 5px; font-family: "Roboto Mono", monospace; font-size: 0.88em; }
        .message-content a { color: var(--accent); text-decoration: none; border-bottom: 1px solid transparent; transition: border-color 0.2s; }
        .message-content a:hover { border-bottom-color: var(--accent); }
        .message-content table { width: 100%; border-collapse: collapse; margin: 16px 0; font-size: 0.9em; border: 1px solid var(--border-3); border-radius: 8px; overflow: hidden; }
        .message-content th { background: var(--bg-3); padding: 10px 14px; text-align: left; font-weight: 600; border-bottom: 1px solid var(--border-2); color: var(--bright-text); }
        .message-content td { padding: 9px 14px; border-bottom: 1px solid var(--border-4); color: var(--text); }
        .message-content img { max-width: 100%; border-radius: 8px; margin: 10px 0; border: 1px solid var(--border-3); }
        .code-block-container { background: var(--bg-2); border: 1px solid var(--border-3); border-radius: 12px; margin: 14px 0; overflow: clip; }
        .code-block-top-bar { display: flex; justify-content: space-between; align-items: center; background: var(--bg-3); padding: 8px 14px; border-bottom: 1px solid var(--border-4); }
        .code-block-language { color: var(--text-2); font-size: 11px; font-family: "Roboto Mono", monospace; text-transform: uppercase; letter-spacing: 0.5px; }
        .code-block-copy-button { background: transparent; border: none; color: var(--text-2); cursor: pointer; display: flex; align-items: center; gap: 6px; padding: 3px 8px; border-radius: 5px; font-size: 12px; transition: all 0.2s; font-family: inherit; }
        .code-block-copy-button:hover { background: var(--border-2); color: var(--bright-text); }
        .code-block-pre { margin: 0 !important; padding: 14px !important; background: transparent !important; overflow-x: auto; }
        .code-block-pre code { font-family: "Roboto Mono", monospace !important; font-size: 13px; line-height: 1.55; background: transparent !important; white-space: pre; }
        .typing-indicator { display: flex; align-items: center; gap: 10px; padding: 8px 0 16px; opacity: 0; transition: opacity 0.2s ease; }
        .typing-indicator.show { opacity: 1; }
        .typing-dots { display: flex; gap: 4px; align-items: center; }
        .typing-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--text-2); animation: dotBounce 1.2s ease-in-out infinite; }
        .typing-dot:nth-child(2) { animation-delay: 0.15s; }
        .typing-dot:nth-child(3) { animation-delay: 0.3s; }
        @keyframes dotBounce { 0%, 80%, 100% { transform: scale(0.7); opacity: 0.4; } 40% { transform: scale(1); opacity: 1; } }
        .typing-label { font-size: 13px; color: var(--text-2); }
        .message-actions-row { display: flex; align-items: center; gap: 3px; padding: 4px 0 16px; opacity: 0; transition: opacity 0.3s ease; }
        .message-actions-row.show { opacity: 1; }
        .act-btn { width: 28px; height: 28px; border-radius: 8px; border: none; background: transparent; color: var(--text-2); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 13px; transition: all 0.15s ease; }
        .act-btn:hover { background: var(--border-3); color: var(--text); }
        .act-btn.retry-disabled { opacity: 0.3; pointer-events: none; }
        #scroll-to-bottom-btn { position: absolute; bottom: 150px; left: 50%; transform: translateX(-50%); width: 36px; height: 36px; border-radius: 50%; background: var(--bg-3); border: 1px solid var(--border-2); color: var(--text); font-size: 16px; display: flex; align-items: center; justify-content: center; cursor: pointer; opacity: 0; pointer-events: none; transition: opacity 0.25s ease; z-index: 20; }
        #scroll-to-bottom-btn.show { opacity: 1; pointer-events: auto; }
        #scroll-to-bottom-btn:hover { background: var(--bg-4); }
        #input-area { position: absolute; bottom: 0; left: 0; right: 0; padding: 0 20px 20px; background: linear-gradient(to top, var(--bg) 70%, transparent); z-index: 10; }
        .input-area-inner { max-width: 680px; margin: 0 auto; }
        #image-preview-strip { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
        .img-thumb-wrap { position: relative; width: 60px; height: 60px; border-radius: 10px; overflow: visible; flex-shrink: 0; }
        .img-thumb { width: 60px; height: 60px; border-radius: 10px; object-fit: cover; border: 1px solid var(--border-2); display: block; }
        .img-thumb-remove { position: absolute; top: -6px; right: -6px; width: 18px; height: 18px; border-radius: 50%; background: #ff4444; border: none; color: #fff; font-size: 10px; cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 2; }
        .input-box { display: flex; align-items: flex-end; gap: 8px; background: var(--bg-2); border: 1px solid var(--border-2); border-radius: 18px; padding: 10px 10px 10px 14px; transition: border-color 0.2s ease; }
        .input-box:focus-within { border-color: var(--border); }
        #message-input { flex: 1; background: transparent; border: none; outline: none; color: var(--bright-text); font-size: 14px; font-family: inherit; resize: none; align-self: center; max-height: 160px; line-height: 1.5; scrollbar-width: none; padding: 2px 0; overflow-y: auto; }
        #message-input::placeholder { color: var(--border); }
        #message-input::-webkit-scrollbar { display: none; }
        .input-actions { display: flex; align-items: center; gap: 4px; flex-shrink: 0; padding-bottom: 2px; }
        .input-btn { width: 34px; height: 34px; border-radius: 10px; border: none; background: transparent; color: var(--text-2); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 16px; transition: all 0.15s ease; }
        .input-btn:hover { background: var(--border-3); color: var(--text); }
        #send-btn { width: 34px; height: 34px; border-radius: 10px; border: none; background: var(--accent); color: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 14px; transition: all 0.2s ease; flex-shrink: 0; }
        #send-btn:hover { background: var(--accent-2); }
        #send-btn.disabled { background: var(--border-3); color: var(--text-2); cursor: not-allowed; pointer-events: none; }
        #send-btn.stop-mode { background: var(--bg-3); border: 1px solid var(--border-2); color: var(--text); }
        #send-btn.stop-mode:hover { background: var(--bg-4); }
        .input-footer { text-align: center; font-size: 11px; color: var(--text-2); margin-top: 8px; opacity: 0.5; }
        #image-upload-input { display: none; }
        .katex-display { margin: 16px 0; padding: 14px; background: var(--bg-3); border-radius: 10px; overflow-x: auto; }
        .katex { font-size: 1.05em; color: var(--bright-text); white-space: nowrap; }
        @media (max-width: 768px) {
            #sidebar { position: fixed; left: 0; top: 0; height: 100vh; transform: translateX(-100%); z-index: 50; }
            #sidebar.open { transform: translateX(0); }
            #sidebar-overlay { display: none; position: fixed; inset: 0; background: rgba(0, 0, 0, 0.6); z-index: 40; }
            #sidebar-overlay.show { display: block; }
            #sidebar-toggle { display: flex; }
            .chat-header-title { max-width: 200px; }
        }
        #rename-modal { display: none; position: fixed; inset: 0; background: rgba(0, 0, 0, 0.7); z-index: 100; align-items: center; justify-content: center; backdrop-filter: blur(4px); }
        #rename-modal.show { display: flex; }
        .modal-box { background: var(--bg-3); border: 1px solid var(--border-2); border-radius: 16px; padding: 24px; width: 360px; display: flex; flex-direction: column; gap: 16px; }
        .modal-title { font-size: 15px; font-weight: 600; color: var(--bright-text); }
        .modal-input { background: var(--bg-4); border: 1px solid var(--border-2); border-radius: 10px; color: var(--bright-text); font-size: 14px; padding: 10px 12px; outline: none; font-family: inherit; transition: border-color 0.2s; }
        .modal-input:focus { border-color: var(--accent); }
        .modal-actions { display: flex; gap: 8px; justify-content: flex-end; }
        .modal-btn { padding: 8px 16px; border-radius: 8px; border: none; font-size: 13px; font-family: inherit; cursor: pointer; transition: all 0.15s ease; }
        .modal-btn.cancel { background: var(--border-3); color: var(--text); }
        .modal-btn.cancel:hover { background: var(--border-2); }
        .modal-btn.confirm { background: var(--accent); color: #fff; }
        .modal-btn.confirm:hover { background: var(--accent-2); }
        .no-chats { padding: 24px 12px; text-align: center; color: var(--text-2); font-size: 13px; line-height: 1.6; }
        .no-chats i { font-size: 24px; margin-bottom: 8px; display: block; opacity: 0.4; }
    </style>
</head>
<body>
    <div id="sidebar-overlay"></div>
    <aside id="sidebar">
        <div id="sidebar-header">
            <div class="sidebar-logo">
                <img src="/assets/img/fav.png" height="18" alt="">
                Void <span>Bot</span>
            </div>
            <button id="new-chat-btn" title="New chat"><i class="far fa-plus"></i></button>
        </div>
        <div id="sidebar-search">
            <div class="sidebar-search-wrap">
                <i class="far fa-search"></i>
                <input type="text" id="search-input" placeholder="Search chats...">
            </div>
        </div>
        <div id="chats-list">
            <div class="no-chats" id="no-chats-msg">
                <i class="far fa-comments"></i>
                No chats yet.<br>Start a conversation!
            </div>
        </div>
        <div id="sidebar-bottom">
            <div class="model-selector-bar" id="model-selector-bar">
                <i class="far fa-microchip-ai"></i>
                <span class="model-selector-label">Model</span>
                <span class="model-selector-value" id="model-display-value">Gemini 3.8 Flash</span>
                <i class="far fa-chevron-up model-selector-arrow"></i>
                <div class="model-popover" id="model-popover">
                    <div class="model-option selected" data-model="gemini-3.8-flash" data-label="Gemini 3.8 Flash">Gemini 3.8 Flash</div>
                    <div class="model-option" data-model="gemini-3.6-flash" data-label="Gemini 3.6 Flash">Gemini 3.6 Flash</div>
                    <div class="model-option" data-model="gemini-3.5-flash" data-label="Gemini 3.5 Flash">Gemini 3.5 Flash</div>
                </div>
            </div>
        </div>
    </aside>
    <main id="main">
        <header id="chat-header">
            <div class="chat-header-left">
                <button class="header-icon-btn" id="sidebar-toggle"><i class="far fa-sidebar"></i></button>
                <span class="chat-header-title" id="chat-header-title">New Chat</span>
            </div>
            <div style="display:flex;gap:4px;">
                <button class="header-icon-btn" id="clear-chat-btn" title="Clear chat"><i class="far fa-trash"></i></button>
            </div>
        </header>
        <div class="messages-container" id="messages-container">
            <div class="messages-inner" id="messages-inner">
                <div id="start-screen">
                    <div class="start-title">What can I help<br>you with today?</div>
                    <div class="start-suggestions" id="suggestions">
                        <button class="suggestion-chip" data-prompt="Explain quantum computing in simple terms">
                            <span class="chip-icon"><i class="far fa-atom"></i></span>
                            Explain quantum physics
                            <span class="chip-text">in simple terms</span>
                        </button>
                        <button class="suggestion-chip" data-prompt="Write a Python function to parse JSON from an API">
                            <span class="chip-icon"><i class="fab fa-python"></i></span>
                            Generate me a Simple HTML
                            <span class="chip-text">That is a minimum of 40 lines</span>
                        </button>
                        <button class="suggestion-chip" data-prompt="Give me 5 creative startup ideas in the AI space">
                            <span class="chip-icon"><i class="far fa-lightbulb"></i></span>
                            Lua Code
                            <span class="chip-text">For a simple roblox game</span>
                        </button>
                        <button class="suggestion-chip" data-prompt="Write a short, dark sci-fi story about a rogue AI">
                            <span class="chip-icon"><i class="far fa-robot"></i></span>
                            Toxic Romance Story
                            <span class="chip-text">about a couple</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
        <button id="scroll-to-bottom-btn"><i class="far fa-arrow-down"></i></button>
        <div id="input-area">
            <div class="input-area-inner">
                <div id="image-preview-strip"></div>
                <div class="input-box">
                    <textarea id="message-input" placeholder="How do I make a steak?" rows="1"></textarea>
                    <div class="input-actions">
                        <button class="input-btn" id="attach-btn" title="Attach image"><i class="far fa-image"></i></button>
                        <button id="send-btn" class="disabled"><i class="far fa-arrow-up"></i></button>
                    </div>
                </div>
                <div class="input-footer">Void Bot can make mistakes. Please verify important info with trusted sources.</div>
            </div>
        </div>
    </main>
    <div id="rename-modal">
        <div class="modal-box">
            <div class="modal-title">Rename Chat</div>
            <input type="text" class="modal-input" id="rename-input" placeholder="Chat name...">
            <div class="modal-actions">
                <button class="modal-btn cancel" id="rename-cancel">Cancel</button>
                <button class="modal-btn confirm" id="rename-confirm">Rename</button>
            </div>
        </div>
    </div>
    <input type="file" id="image-upload-input" accept="image/*" multiple>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="https://unpkg.com/markdown-it@14.1.0/dist/markdown-it.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>

    <script>
        document.getElementById("csslink") &&
        (document.getElementById("csslink").href =
        `/assets/css/colors/${localStorage.getItem("singularity_theme") || "default"}.css`);

        const API_URL = "/api/worker";
        const OBF_KEY = [173, 91, 202, 17, 138, 64, 229, 53];

        function obf(bytes) {
            const out = new Uint8Array(bytes.length);
            for (let i = 0; i < bytes.length; i++) {
                out[i] = bytes[i] ^ OBF_KEY[i % OBF_KEY.length] ^ (i & 255);
            }
            return out;
        }
        const MAX_CONTEXT = 15;
        const STORAGE_KEY = "singularity_chats";

        const md = window.markdownit({
            html: false,
            linkify: true,
            typographer: true,
            highlight(str, lang) {
                if (lang && hljs.getLanguage(lang)) {
                    try {
                        return (
                            '<pre class="hljs"><code class="language-' +
                            lang +
                            '">' +
                            hljs.highlight(str, { language: lang, ignoreIllegals: true }).value +
                            "</code></pre>"
                        );
                    } catch {}
                }
                return (
                    '<pre class="hljs"><code' +
                    (lang ? ' class="language-' + lang + '"' : "") +
                    ">" +
                    str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;") +
                    "</code></pre>"
                );
            },
        });

        let chats = [];
        let activeChatId = null;
        let isGenerating = false;
        let currentModel = "gemini-3.8-flash";
        let pendingImages = [];
        let renamingChatId = null;
        let abortController = null;

        function dataUrlToInlinePart(dataUrl) {
            const [header, base64] = dataUrl.split(",");
            const mimeType = header.match(/data:(.*?);base64/)?.[1] || "image/png";
            return { inline_data: { mime_type: mimeType, data: base64 } };
        }

        function buildParts(text, images = []) {
            const parts = [];
            if (text) parts.push({ text });
            images.forEach((dataUrl) => parts.push(dataUrlToInlinePart(dataUrl)));
            return parts;
        }

        function saveToStorage() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(chats));
            } catch {}
        }

        function loadFromStorage() {
            try {
                chats = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
            } catch {
                chats = [];
            }
        }

        function generateId() {
            return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
        }

        function createChat(title = "New Chat") {
            const chat = {
                id: generateId(),
                title,
                messages: [],
                model: currentModel,
                createdAt: Date.now(),
            };
            chats.unshift(chat);
            saveToStorage();
            return chat;
        }

        function getActiveChat() {
            return chats.find((c) => c.id === activeChatId) || null;
        }

        function renderSidebar(filter = "") {
            const list = document.getElementById("chats-list");
            const noMsg = document.getElementById("no-chats-msg");
            const filtered = filter
                ? chats.filter((c) => c.title.toLowerCase().includes(filter.toLowerCase()))
                : chats;
            const existing = list.querySelectorAll(".chat-item, .chats-section-label");
            existing.forEach((el) => el.remove());
            if (filtered.length === 0) {
                noMsg.style.display = "block";
                return;
            }
            noMsg.style.display = "none";
            const todayStart = new Date();
            todayStart.setHours(0, 0, 0, 0);
            const yesterdayStart = new Date(todayStart);
            yesterdayStart.setDate(yesterdayStart.getDate() - 1);
            const weekStart = new Date(todayStart);
            weekStart.setDate(weekStart.getDate() - 7);
            const sections = [
                { label: "Today", items: [] },
                { label: "Yesterday", items: [] },
                { label: "Last 7 days", items: [] },
                { label: "Older", items: [] },
            ];
            filtered.forEach((chat) => {
                const d = chat.createdAt;
                if (d >= todayStart.getTime()) sections[0].items.push(chat);
                else if (d >= yesterdayStart.getTime()) sections[1].items.push(chat);
                else if (d >= weekStart.getTime()) sections[2].items.push(chat);
                else sections[3].items.push(chat);
            });
            sections.forEach(({ label, items }) => {
                if (items.length === 0) return;
                const labelEl = document.createElement("div");
                labelEl.className = "chats-section-label";
                labelEl.textContent = label;
                list.appendChild(labelEl);
                items.forEach((chat) => list.appendChild(buildChatItem(chat)));
            });
        }

        function buildChatItem(chat) {
            const item = document.createElement("div");
            item.className = "chat-item" + (chat.id === activeChatId ? " active" : "");
            item.dataset.id = chat.id;
            item.innerHTML = `
                <i class="far fa-comment chat-item-icon"></i>
                <span class="chat-item-title">${escHtml(chat.title)}</span>
                <div class="chat-item-actions">
                    <button class="chat-action-btn rename-btn" title="Rename"><i class="far fa-pen"></i></button>
                    <button class="chat-action-btn delete delete-btn" title="Delete"><i class="far fa-trash"></i></button>
                </div>`;
            item.querySelector(".chat-item-title").addEventListener("click", () => switchChat(chat.id));
            item.querySelector(".chat-item-icon").addEventListener("click", () => switchChat(chat.id));
            item.querySelector(".rename-btn").addEventListener("click", (e) => {
                e.stopPropagation();
                openRenameModal(chat.id);
            });
            item.querySelector(".delete-btn").addEventListener("click", (e) => {
                e.stopPropagation();
                deleteChat(chat.id);
            });
            return item;
        }

        function escHtml(str) {
            return str
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;");
        }

        function switchChat(id) {
            activeChatId = id;
            renderSidebar(document.getElementById("search-input").value);
            renderMessages();
            closeMobileSidebar();
        }

        function deleteChat(id) {
            chats = chats.filter((c) => c.id !== id);
            saveToStorage();
            if (activeChatId === id) {
                activeChatId = chats.length ? chats[0].id : null;
                renderMessages();
            }
            renderSidebar(document.getElementById("search-input").value);
        }

        function openRenameModal(id) {
            renamingChatId = id;
            const chat = chats.find((c) => c.id === id);
            document.getElementById("rename-input").value = chat ? chat.title : "";
            document.getElementById("rename-modal").classList.add("show");
            setTimeout(() => document.getElementById("rename-input").select(), 50);
        }

        function closeRenameModal() {
            document.getElementById("rename-modal").classList.remove("show");
            renamingChatId = null;
        }

        document.getElementById("rename-cancel").addEventListener("click", closeRenameModal);
        document.getElementById("rename-confirm").addEventListener("click", () => {
            if (!renamingChatId) return;
            const val = document.getElementById("rename-input").value.trim();
            if (!val) return;
            const chat = chats.find((c) => c.id === renamingChatId);
            if (chat) {
                chat.title = val;
                saveToStorage();
            }
            renderSidebar(document.getElementById("search-input").value);
            if (renamingChatId === activeChatId) updateHeaderTitle(val);
            closeRenameModal();
        });
        document.getElementById("rename-modal").addEventListener("click", (e) => {
            if (e.target === document.getElementById("rename-modal")) closeRenameModal();
        });
        document.getElementById("rename-input").addEventListener("keydown", (e) => {
            if (e.key === "Enter") document.getElementById("rename-confirm").click();
            if (e.key === "Escape") closeRenameModal();
        });

        function updateHeaderTitle(title) {
            document.getElementById("chat-header-title").textContent = title;
        }

        function renderMessages() {
            const chat = getActiveChat();
            const inner = document.getElementById("messages-inner");
            const startScreen = document.getElementById("start-screen");
            inner.querySelectorAll(".message, .message-actions-row, .typing-indicator").forEach((el) => el.remove());
            if (!chat || chat.messages.length === 0) {
                startScreen.classList.remove("gone");
                updateHeaderTitle(chat ? chat.title : "New Chat");
                return;
            }
            startScreen.classList.add("gone");
            updateHeaderTitle(chat.title);
            chat.messages.forEach((msg, i) => {
                if (msg.role === "user") {
                    const el = buildUserMessage(msg.content, msg.images);
                    el.querySelector(".message-content").classList.add("show");
                    inner.appendChild(el);
                } else {
                    const el = buildAiMessage(msg.content);
                    inner.appendChild(el);
                    const actions = buildMessageActions(el, i === chat.messages.length - 1 ? chat.messages[i - 1]?.content : null, i);
                    actions.classList.add("show");
                    inner.appendChild(actions);
                }
            });
            const container = document.getElementById("messages-container");
            container.scrollTop = container.scrollHeight;
        }

        function buildUserMessage(text, images) {
            const wrap = document.createElement("div");
            wrap.className = "message user-message";
            const content = document.createElement("div");
            content.className = "message-content";
            if (images && images.length) {
                images.forEach((src) => {
                    const img = document.createElement("img");
                    img.src = src;
                    img.className = "user-image-preview";
                    content.appendChild(img);
                });
            }
            if (text) {
                const t = document.createElement("div");
                t.textContent = text;
                content.appendChild(t);
            }
            wrap.appendChild(content);
            return wrap;
        }

        function buildAiMessage(content) {
            const wrap = document.createElement("div");
            wrap.className = "message ai-message";
            const contentDiv = document.createElement("div");
            contentDiv.className = "message-content";
            renderMarkdown(content, contentDiv);
            wrap.appendChild(contentDiv);
            return wrap;
        }

        function renderMarkdown(text, target) {
            target.innerHTML = md.render(text);
            if (window.renderMathInElement) {
                renderMathInElement(target, {
                    delimiters: [
                        { left: "$$", right: "$$", display: true },
                        { left: "$", right: "$", display: false },
                    ],
                    throwOnError: false,
                });
            }
            target.querySelectorAll("pre.hljs").forEach((pre) => {
                if (pre.parentElement.classList.contains("code-block-container")) return;
                const wrapper = document.createElement("div");
                wrapper.className = "code-block-container";
                const codeEl = pre.querySelector("code");
                let lang = "text";
                if (codeEl) {
                    const lc = Array.from(codeEl.classList).find((c) => c.startsWith("language-"));
                    if (lc) lang = lc.replace("language-", "");
                }
                const topBar = document.createElement("div");
                topBar.className = "code-block-top-bar";
                const langSpan = document.createElement("span");
                langSpan.className = "code-block-language";
                langSpan.textContent = lang;
                const copyBtn = document.createElement("button");
                copyBtn.className = "code-block-copy-button";
                copyBtn.innerHTML = `<i class="far fa-copy"></i><span class="copy-text">Copy</span>`;
                wrapper.dataset.code = codeEl ? codeEl.innerText : "";
                topBar.appendChild(langSpan);
                topBar.appendChild(copyBtn);
                pre.parentNode.insertBefore(wrapper, pre);
                wrapper.appendChild(topBar);
                wrapper.appendChild(pre);
                pre.className = "code-block-pre";
            });
        }

        function buildMessageActions(aiEl, userPrompt, msgIndex) {
            const row = document.createElement("div");
            row.className = "message-actions-row";
            const copyBtn = document.createElement("button");
            copyBtn.className = "act-btn";
            copyBtn.innerHTML = '<i class="far fa-copy"></i>';
            copyBtn.title = "Copy";
            copyBtn.addEventListener("click", () => {
                navigator.clipboard.writeText(aiEl.querySelector(".message-content").innerText);
                copyBtn.innerHTML = '<i class="far fa-check" style="color:lime"></i>';
                setTimeout(() => (copyBtn.innerHTML = '<i class="far fa-copy"></i>'), 1500);
            });
            const retryBtn = document.createElement("button");
            retryBtn.className = "act-btn";
            retryBtn.innerHTML = '<i class="far fa-rotate-right"></i>';
            retryBtn.title = "Retry";
            const chat = getActiveChat();
            const isLast = chat && msgIndex === chat.messages.length - 1;
            if (!isLast) retryBtn.classList.add("retry-disabled");
            retryBtn.addEventListener("click", () => {
                if (isGenerating || retryBtn.classList.contains("retry-disabled")) return;
                const c = getActiveChat();
                if (!c) return;
                if (c.messages[c.messages.length - 1]?.role === "assistant") c.messages.pop();
                const lastUser = c.messages[c.messages.length - 1];
                if (lastUser?.role === "user") c.messages.pop();
                saveToStorage();
                renderMessages();
                startAiResponse(lastUser?.content || "", lastUser?.images || []);
            });
            row.appendChild(copyBtn);
            row.appendChild(retryBtn);
            return row;
        }

        async function startAiResponse(userText, images = []) {
            if (isGenerating) return;
            isGenerating = true;
            abortController = new AbortController();
            updateSendBtn();
            const inner = document.getElementById("messages-inner");
            document.getElementById("start-screen").classList.add("gone");
            const typing = document.createElement("div");
            typing.className = "typing-indicator";
            typing.innerHTML = `<div class="typing-dots"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div><span class="typing-label">Thinking...</span>`;
            inner.appendChild(typing);
            requestAnimationFrame(() => typing.classList.add("show"));
            const aiWrap = document.createElement("div");
            aiWrap.className = "message ai-message";
            const aiContent = document.createElement("div");
            aiContent.className = "message-content";
            aiWrap.appendChild(aiContent);
            inner.appendChild(aiWrap);
            scrollToBottom();
            let fullResponse = "";
            try {
                const chat = getActiveChat();
                const historySlice = (chat?.messages || [])
                    .slice(-MAX_CONTEXT)
                    .map((m) => ({
                        role: m.role === "assistant" ? "model" : "user",
                        parts: buildParts(m.content, m.images)
                    }))
                    .filter((m) => m.parts.length > 0);
                const currentUserMessage = {
                    role: "user",
                    parts: buildParts(userText, images).length ? buildParts(userText, images) : [{ text: "Hello" }]
                };
                const contents = [...historySlice, currentUserMessage];
                const response = await fetch(API_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/octet-stream" },
                    signal: abortController.signal,
                    body: obf(new TextEncoder().encode(JSON.stringify({
                        model: currentModel,
                        contents,
                        generationConfig: {
                            temperature: 0.7,
                            maxOutputTokens: 4096
                        }
                    })))
                });
                const raw = new Uint8Array(await response.arrayBuffer());
                let data = null;
                try {
                    data = JSON.parse(new TextDecoder().decode(obf(raw)));
                } catch {}
                if (!response.ok || !data) {
                    let message = "API Error";
                    if (data && data.error) message = data.error.message || data.error;
                    throw new Error(typeof message === "string" ? message : JSON.stringify(message));
                }
                typing.remove();
                const reply = data.candidates?.[0]?.content?.parts?.[0]?.text || "Sorry, I couldn't generate a response.";
                fullResponse = reply;
                renderMarkdown(fullResponse, aiContent);
                scrollToBottom();
                const c = getActiveChat();
                if (c) {
                    c.messages.push({ role: "user", content: userText, images });
                    c.messages.push({ role: "assistant", content: fullResponse });
                    if (c.messages.length === 2 && userText) {
                        c.title = userText.length > 40 ? userText.slice(0, 40) + "…" : userText;
                        updateHeaderTitle(c.title);
                    }
                    saveToStorage();
                    renderSidebar(document.getElementById("search-input").value);
                }
            } catch (err) {
                if (typing.parentNode) typing.remove();
                if (err.name === "AbortError") {
                    if (fullResponse) renderMarkdown(fullResponse, aiContent);
                    else aiContent.innerHTML = '<span style="color:var(--text-2);font-size:13px">Generation stopped.</span>';
                } else {
                    aiContent.innerHTML = `<span style="color:#ff4444">Error: ${escHtml(err.message)}</span>`;
                }
            } finally {
                isGenerating = false;
                abortController = null;
                updateSendBtn();
                const chat = getActiveChat();
                const msgIndex = chat ? chat.messages.length - 1 : -1;
                const actions = buildMessageActions(aiWrap, userText, msgIndex);
                setTimeout(() => actions.classList.add("show"), 100);
                inner.appendChild(actions);
                checkScrollBtn();
            }
        }

        function scrollToBottom() {
            const c = document.getElementById("messages-container");
            c.scrollTo({ top: c.scrollHeight, behavior: "smooth" });
        }

        function checkScrollBtn() {
            const c = document.getElementById("messages-container");
            const btn = document.getElementById("scroll-to-bottom-btn");
            const away = c.scrollTop + c.clientHeight < c.scrollHeight - 120;
            btn.classList.toggle("show", away && c.scrollHeight > c.clientHeight);
        }

        document.getElementById("scroll-to-bottom-btn").addEventListener("click", scrollToBottom);
        document.getElementById("messages-container").addEventListener("scroll", checkScrollBtn);

        function updateSendBtn() {
            const btn = document.getElementById("send-btn");
            if (isGenerating) {
                btn.classList.remove("disabled");
                btn.classList.add("stop-mode");
                btn.innerHTML = '<i class="far fa-stop"></i>';
            } else {
                btn.classList.remove("stop-mode");
                const hasContent = document.getElementById("message-input").value.trim() || pendingImages.length;
                btn.classList.toggle("disabled", !hasContent);
                btn.innerHTML = '<i class="far fa-arrow-up"></i>';
            }
        }

        function sendMessage() {
            if (isGenerating) {
                abortController?.abort();
                return;
            }
            const input = document.getElementById("message-input");
            const text = input.value.trim();
            const images = [...pendingImages];
            if (!text && images.length === 0) return;
            if (!activeChatId) {
                const chat = createChat("New Chat");
                activeChatId = chat.id;
                renderSidebar();
            }
            const inner = document.getElementById("messages-inner");
            const userEl = buildUserMessage(text, images);
            inner.appendChild(userEl);
            requestAnimationFrame(() => userEl.querySelector(".message-content").classList.add("show"));
            scrollToBottom();
            input.value = "";
            input.style.height = "auto";
            pendingImages = [];
            document.getElementById("image-preview-strip").innerHTML = "";
            updateSendBtn();
            startAiResponse(text, images);
        }

        document.getElementById("send-btn").addEventListener("click", sendMessage);
        document.getElementById("message-input").addEventListener("keydown", (e) => {
            if (e.key === "Enter" && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });
        document.getElementById("message-input").addEventListener("input", function () {
            this.style.height = "auto";
            this.style.height = Math.min(this.scrollHeight, 160) + "px";
            updateSendBtn();
        });

        document.getElementById("new-chat-btn").addEventListener("click", () => {
            const chat = createChat("New Chat");
            activeChatId = chat.id;
            renderSidebar();
            renderMessages();
            document.getElementById("message-input").focus();
            closeMobileSidebar();
        });

        document.getElementById("clear-chat-btn").addEventListener("click", () => {
            const chat = getActiveChat();
            if (!chat) return;
            chat.messages = [];
            chat.title = "New Chat";
            saveToStorage();
            renderSidebar();
            renderMessages();
        });

        document.getElementById("search-input").addEventListener("input", function () {
            renderSidebar(this.value);
        });

        document.getElementById("suggestions").addEventListener("click", (e) => {
            const chip = e.target.closest(".suggestion-chip");
            if (!chip) return;
            const prompt = chip.dataset.prompt;
            document.getElementById("message-input").value = prompt;
            updateSendBtn();
            sendMessage();
        });

        document.getElementById("model-selector-bar").addEventListener("click", (e) => {
            e.stopPropagation();
            document.getElementById("model-popover").classList.toggle("open");
        });

        document.querySelectorAll(".model-option").forEach((opt) => {
            opt.addEventListener("click", (e) => {
                e.stopPropagation();
                currentModel = opt.dataset.model;
                document.getElementById("model-display-value").textContent = opt.dataset.label;
                document.querySelectorAll(".model-option").forEach((o) => o.classList.remove("selected"));
                opt.classList.add("selected");
                document.getElementById("model-popover").classList.remove("open");
            });
        });

        document.addEventListener("click", () => {
            document.getElementById("model-popover").classList.remove("open");
        });

        document.getElementById("attach-btn").addEventListener("click", () => {
            document.getElementById("image-upload-input").click();
        });

        document.getElementById("image-upload-input").addEventListener("change", function () {
            const files = Array.from(this.files);
            files.forEach((file) => {
                if (!file.type.startsWith("image/")) return;
                const reader = new FileReader();
                reader.onload = (ev) => {
                    pendingImages.push(ev.target.result);
                    renderImagePreviews();
                    updateSendBtn();
                };
                reader.readAsDataURL(file);
            });
            this.value = "";
        });

        function renderImagePreviews() {
            const strip = document.getElementById("image-preview-strip");
            strip.innerHTML = "";
            pendingImages.forEach((src, i) => {
                const wrap = document.createElement("div");
                wrap.className = "img-thumb-wrap";
                const img = document.createElement("img");
                img.src = src;
                img.className = "img-thumb";
                const removeBtn = document.createElement("button");
                removeBtn.className = "img-thumb-remove";
                removeBtn.innerHTML = '<i class="far fa-times"></i>';
                removeBtn.addEventListener("click", () => {
                    pendingImages.splice(i, 1);
                    renderImagePreviews();
                    updateSendBtn();
                });
                wrap.appendChild(img);
                wrap.appendChild(removeBtn);
                strip.appendChild(wrap);
            });
        }

        document.getElementById("message-input").addEventListener("paste", (e) => {
            const items = e.clipboardData?.items;
            if (!items) return;
            for (const item of items) {
                if (item.type.startsWith("image/")) {
                    const file = item.getAsFile();
                    const reader = new FileReader();
                    reader.onload = (ev) => {
                        pendingImages.push(ev.target.result);
                        renderImagePreviews();
                        updateSendBtn();
                    };
                    reader.readAsDataURL(file);
                }
            }
        });

        document.getElementById("messages-inner").addEventListener("click", (e) => {
            const btn = e.target.closest(".code-block-copy-button");
            if (!btn) return;
            const container = btn.closest(".code-block-container");
            navigator.clipboard.writeText(container.dataset.code || "").then(() => {
                const icon = btn.querySelector("i");
                const text = btn.querySelector(".copy-text");
                icon.className = "far fa-check";
                if (text) text.textContent = "Copied!";
                btn.style.color = "lime";
                setTimeout(() => {
                    icon.className = "far fa-copy";
                    if (text) text.textContent = "Copy";
                    btn.style.color = "";
                }, 2000);
            });
        });

        function closeMobileSidebar() {
            if (window.innerWidth <= 768) {
                document.getElementById("sidebar").classList.remove("open");
                document.getElementById("sidebar-overlay").classList.remove("show");
            }
        }

        document.getElementById("sidebar-toggle").addEventListener("click", () => {
            document.getElementById("sidebar").classList.toggle("open");
            document.getElementById("sidebar-overlay").classList.toggle("show");
        });
        document.getElementById("sidebar-overlay").addEventListener("click", closeMobileSidebar);

        loadFromStorage();
        if (chats.length === 0) {
            const chat = createChat("New Chat");
            activeChatId = chat.id;
        } else {
            activeChatId = chats[0].id;
        }

        const placeholders = [
            "What is the meaning of life?",
            "Why do we dream?",
            "Is free will an illusion?",
