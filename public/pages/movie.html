<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BlackHole</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/alpinejs/3.13.3/cdn.min.js" defer></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root{color-scheme:dark;--bg:#040714;--panel:#090b13;--card:#1a1d29;--border:#2b2f40;--muted:#cacaca;--text:#f9f9f9;--accent:#0063e5;--accent-hover:#0483ee;--accent-soft:#0483ee}
        *{box-sizing:border-box}
        body{background:#040714;color:var(--text);font-family:'Avenir','Helvetica Neue',Helvetica,Arial,sans-serif;margin:0;overflow-x:hidden}

        .btn-accent{background:#f9f9f9;color:#000;border:none;border-radius:4px;letter-spacing:1.8px;text-transform:uppercase;transition:background .2s ease}
        .btn-accent:hover{background:#c6c6c6}
        .btn-secondary{background:#1a1d29;color:#f9f9f9;border:1px solid #f9f9f9;border-radius:4px;letter-spacing:1.8px;text-transform:uppercase;transition:background .2s ease,color .2s ease}
        .btn-secondary:hover{background:#f9f9f9;color:#000}

        .row-scroll{scrollbar-width:none;-ms-overflow-style:none;scroll-behavior:smooth;padding-bottom:16px;padding-top:6px}
        .row-scroll::-webkit-scrollbar{display:none}

        .movie-card{transition:transform .25s;border-radius:10px;overflow:hidden;background:#000}
        .movie-card:hover{transform:scale(1.05);z-index:10}
        .info-overlay{opacity:0;transition:opacity .2s;background:rgba(4,7,20,.85)}
        .row-title{font-size:1.1rem;font-weight:700;letter-spacing:.5px;margin-bottom:.4rem;color:#f9f9f9}

        input,select{background:#1a1d29 !important;border:1px solid #2b2f40 !important;color:#f9f9f9 !important;border-radius:4px}
        input:focus,select:focus{outline:none;border-color:#f9f9f9 !important}
        select{cursor:pointer}

        .hero-gradient{background:rgba(4,7,20,.5)}
        .skeleton{background:#1a1d29;animation:pulse 1.2s ease infinite}
        @keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}

        .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#090b13;border:1px solid #2b2f40;padding:12px 20px;border-radius:8px;z-index:100;max-width:90vw;font-size:14px}

        .player-overlay{position:fixed;inset:0;background:#000;z-index:9999}
        .player-iframe{width:100%;height:100%;border:none}
        .player-topbar{position:absolute;top:0;left:0;right:0;height:64px;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;z-index:20;opacity:0;transition:opacity .25s;pointer-events:none}
        .player-overlay:hover .player-topbar,.player-topbar.show{opacity:1;pointer-events:auto}
        .player-title{color:#fff;font-size:16px;font-weight:600;letter-spacing:.2px}
        .player-exit{position:absolute;right:20px;top:50%;transform:translateY(-50%);background:#000;border:1px solid #f9f9f9;color:#fff;padding:8px 16px;border-radius:4px;font-size:13px;font-weight:500;letter-spacing:1.4px;text-transform:uppercase;cursor:pointer;transition:background .15s,color .15s}
        .player-exit:hover{background:#f9f9f9;color:#000}

        .theater-curtains{position:fixed;inset:0;z-index:10000;pointer-events:none;overflow:hidden}
        .curtain{position:absolute;top:0;bottom:0;width:52%;background:#c41e1e;transition:transform 1.5s cubic-bezier(.4,0,.2,1);will-change:transform}
        .curtain-left{left:0;border-right:3px solid #4a0000}
        .curtain-right{right:0;border-left:3px solid #4a0000}
        .theater-curtains.open .curtain-left{transform:translateX(-102%)}
        .theater-curtains.open .curtain-right{transform:translateX(102%)}
        .curtain-valance{position:absolute;top:0;left:0;right:0;height:32px;background:#8b0000;border-bottom:3px solid #4a0000;z-index:2;transition:opacity .7s ease .3s}
        .theater-curtains.open .curtain-valance{opacity:0}

        .genre-pill{background:#1a1d29;border:1px solid #2b2f40;border-radius:4px;padding:4px 12px;font-size:12px;letter-spacing:1px;text-transform:uppercase}
        .genre-pill:hover{border-color:#f9f9f9}
        .text-purple-400{color:#4da3ff !important}

        .nav-solid{background:#090b13 !important}
        .nav-clear{background:rgba(4,7,20,.6)}
        .nf-nav{height:70px;padding:0 36px}
        .nf-logo{color:#fff;font-size:1.5rem;font-weight:800;letter-spacing:1px;cursor:pointer;flex-shrink:0}
        .nf-nav-links{display:none;gap:28px;margin-left:36px}
        @media(min-width:640px){.nf-nav-links{display:flex}}
        .nf-nav-links button{color:#f9f9f9;background:none;border:none;cursor:pointer;font-size:13px;letter-spacing:1.42px;text-transform:uppercase;padding:6px 0;position:relative}
        .nf-nav-links button::after{content:'';position:absolute;left:0;right:0;bottom:-2px;height:2px;background:#f9f9f9;transform:scaleX(0);transform-origin:left;opacity:0;transition:all .25s cubic-bezier(.25,.46,.45,.94)}
        .nf-nav-links button:hover::after,.nf-nav-links button.is-active::after{transform:scaleX(1);opacity:1}
        .nf-nav-right{margin-left:auto;display:flex;align-items:center;gap:10px}
        .nf-nav-right input,.nf-nav-right select{font-size:13px;padding:6px 12px;height:36px}

        .nf-hero{position:relative;width:100%;height:56vw;max-height:80vh;min-height:420px;overflow:hidden}
        .nf-hero-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 1.2s ease-in-out}
        .nf-hero-bg.is-active{opacity:1}
        .nf-hero-content{position:absolute;bottom:22%;left:36px;max-width:38%;z-index:2;transition:opacity .6s}
        .nf-hero-content.is-fading{opacity:0}
        .nf-hero-dots{position:absolute;bottom:14%;left:50%;transform:translateX(-50%);z-index:3;display:flex;gap:8px}
        .nf-hero-dot{width:8px;height:8px;border-radius:50%;background:#6b6f7d;border:none;cursor:pointer;padding:0;transition:all .2s}
        .nf-hero-dot.is-active{background:#f9f9f9;width:22px;border-radius:4px}
        @media(max-width:768px){.nf-hero-content{max-width:85%;left:20px;bottom:24%}.nf-nav{padding:0 16px}}
        .nf-hero-title{font-size:clamp(1.8rem,4.2vw,3.4rem);font-weight:800;line-height:1.1;margin-bottom:1rem}
        .nf-hero-desc{font-size:clamp(.85rem,1.3vw,1.05rem);color:#f9f9f9;line-height:1.5;margin-bottom:1.25rem;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
        .nf-hero-btns{display:flex;gap:12px;flex-wrap:wrap}
        .nf-hero-btns .btn-accent,.nf-hero-btns .btn-secondary{font-size:.9rem;font-weight:700;padding:.7rem 1.8rem;display:inline-flex;align-items:center;gap:8px}

        .nf-rows{position:relative;z-index:10;margin-top:-6vw;padding:0 0 4rem}
        .nf-row{padding:0;margin-bottom:1.5rem}
        .nf-row-title{font-size:1.15rem;font-weight:700;letter-spacing:.4px;color:#f9f9f9;margin-bottom:.2rem;padding:0 36px}
        .nf-row-track{display:flex;gap:16px;overflow-x:auto;scroll-behavior:smooth;padding:18px 36px 26px;scrollbar-width:none;-ms-overflow-style:none}
        .nf-row-track::-webkit-scrollbar{display:none}
        .nf-card,.nf-grid-card{position:relative;border-radius:10px;overflow:hidden;cursor:pointer;background:#1a1d29;border:3px solid #2b2f40;transition:transform .25s cubic-bezier(.25,.46,.45,.94),border-color .25s}
        .nf-card{flex:0 0 auto;width:140px}
        @media(min-width:500px){.nf-card{width:160px}}
        @media(min-width:800px){.nf-card{width:185px}}
        @media(min-width:1100px){.nf-card{width:210px}}
        .nf-card:hover,.nf-grid-card:hover{transform:scale(1.05);border-color:#f9f9f9;z-index:20}
        .nf-card img,.nf-grid-card img{width:100%;aspect-ratio:2/3;object-fit:cover;display:block}
        .nf-card-info{position:absolute;left:0;right:0;bottom:0;background:rgba(4,7,20,.88);opacity:0;transition:opacity .2s;padding:10px}
        .nf-card:hover .nf-card-info,.nf-grid-card:hover .nf-card-info{opacity:1}
        .nf-card-info h3{font-size:12px;font-weight:700;line-height:1.3;margin:0}
        .nf-card-info p{font-size:11px;color:#cacaca;margin:4px 0 0}

        .nf-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px;padding:0 36px}
        @media(min-width:500px){.nf-grid{grid-template-columns:repeat(3,1fr)}}
        @media(min-width:800px){.nf-grid{grid-template-columns:repeat(4,1fr)}}
        @media(min-width:1100px){.nf-grid{grid-template-columns:repeat(6,1fr)}}
        .nf-grid-card{width:100%}

        @media(min-width:640px) and (max-width:899px){.nf-nav-links{margin-left:16px;gap:14px}.nf-nav-right{gap:6px;min-width:0}.nf-nav-right input{width:130px;min-width:0}.nf-nav-right select{max-width:95px}}
        @media(max-width:639px){.nf-logo{font-size:1.15rem}.nf-nav-right{gap:6px;flex:1;min-width:0;justify-content:flex-end}.nf-nav-right input{flex:1 1 0;width:0;min-width:0}.nf-nav-right select{max-width:78px;min-width:0}.nf-row-title{padding:0 16px}.nf-row-track{padding:18px 16px 26px}.nf-grid{padding:0 16px}}

        [x-cloak]{display:none !important}
    </style>
</head>
<body class="min-h-screen" x-data="app()" x-init="init()">

    <template x-if="showPlayer && detailMovie">
        <div class="player-overlay"
             @mousemove="showTopBar = true; clearTimeout(topBarTimer); topBarTimer = setTimeout(() => showTopBar = false, 2500)"
             @mouseleave="showTopBar = false">
            <div class="player-topbar" :class="{ 'show': showTopBar }">
                <button @click="showPlayer = false" class="player-exit">Exit</button>
            </div>
            <iframe
                class="player-iframe"
                :src="playerUrl"
                frameborder="0"
                scrolling="no"
                allowfullscreen
                allow="autoplay; fullscreen; encrypted-media; picture-in-picture">
            </iframe>
        </div>
    </template>

    <nav class="fixed top-0 left-0 right-0 z-50 nf-nav flex items-center transition-all duration-300"
         :class="scrolled || showDetail ? 'nav-solid' : 'nav-clear'"
         x-show="!showPlayer">
        <div class="nf-logo" @click="closeDetail()">BlackHole</div>
        <template x-if="!showDetail">
            <div class="nf-nav-links">
                <button @click="switchTab('movies')" :class="{ 'is-active': currentTab === 'movies' }">Movies</button>
                <button @click="switchTab('shows')" :class="{ 'is-active': currentTab === 'shows' }">TV Shows</button>
            </div>
        </template>
        <template x-if="showDetail">
            <div class="nf-nav-links">
                <button @click="closeDetail()">← Back</button>
            </div>
        </template>
        <template x-if="!showDetail">
            <div class="nf-nav-right">
                <input type="text" x-model="searchQuery" @input="onSearchInput()"
                       placeholder="Titles, people, genres">
                <select x-model="selectedGenre" @change="applyFilters()">
                    <option value="">Genres</option>
                    <template x-for="genre in genres" :key="genre.id">
                        <option :value="genre.id" x-text="genre.name"></option>
                    </template>
                </select>
                <select x-model="sortBy" @change="applyFilters()">
                    <option value="popularity.desc">Popular</option>
                    <option value="vote_average.desc">Top Rated</option>
                    <option value="release_date.desc">Newest</option>
                    <option value="revenue.desc">Grossing</option>
                </select>
            </div>
        </template>
    </nav>

    <div class="toast" x-show="toast" x-transition x-text="toast" style="display:none;"></div>

    <template x-if="showDetail && !showPlayer">
        <div>
            <div x-show="detailLoading" class="flex items-center justify-center h-screen">
                <div class="text-lg text-gray-400">Loading...</div>
            </div>
            <div x-show="detailError" class="flex flex-col items-center justify-center h-screen gap-4">
                <p class="text-lg text-red-500" x-text="detailError"></p>
                <button @click="closeDetail()" class="btn-accent px-6 py-2.5 rounded-xl font-semibold">Go Back</button>
            </div>

            <template x-if="!detailLoading && !detailError && detailMovie">
                <div>
                    <div class="relative h-[65vh] md:h-[80vh] w-full overflow-hidden">
                        <img :src="detailMovie.backdrop_path ? 'https://image.tmdb.org/t/p/original' + detailMovie.backdrop_path : 'https://via.placeholder.com/1280x720?text=No+Image'"
                             class="absolute inset-0 w-full h-full object-cover" alt="">
                        <div class="absolute inset-0 hero-gradient"></div>
                        <div class="absolute bottom-0 left-0 right-0 p-6 md:p-14 pb-14 md:pb-20">
                            <div class="max-w-2xl">
                                <h1 class="text-3xl md:text-5xl font-bold mb-3 leading-tight"
                                    x-text="detailMovie.title || detailMovie.name"></h1>
                                <div class="flex flex-wrap items-center gap-3 text-sm text-gray-300 mb-5">
                                    <span class="text-purple-400 font-semibold"
                                          x-text="(detailMovie.vote_average ? detailMovie.vote_average.toFixed(1) : 'N/A') + ' Rating'"></span>
                                    <span x-text="(detailMovie.release_date || detailMovie.first_air_date || '').slice(0,4)"></span>
                                    <span x-show="detailMovie.runtime" x-text="detailMovie.runtime + ' min'"></span>
                                    <span x-show="detailMovie.number_of_seasons"
                                          x-text="detailMovie.number_of_seasons + ' Season' + (detailMovie.number_of_seasons > 1 ? 's' : '')"></span>
                                </div>
                                <p class="text-sm md:text-base text-gray-200 mb-6 max-w-xl leading-relaxed"
                                   x-text="detailMovie.overview || 'No description available.'"></p>
                                <div class="flex flex-wrap gap-3">
                                    <button @click="showPlayer = true"
                                            class="btn-accent font-semibold px-7 py-3 rounded-xl flex items-center gap-2">
                                        ▶ Play
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="px-6 md:px-14 py-10 max-w-6xl">
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-10">
                            <div class="md:col-span-2 space-y-8">
                                <div x-show="detailMovie.genres && detailMovie.genres.length">
                                    <h3 class="text-gray-400 text-sm mb-2">Genres</h3>
                                    <div class="flex flex-wrap gap-2">
                                        <template x-for="genre in (detailMovie.genres || [])" :key="genre.id">
                                            <span class="genre-pill" x-text="genre.name"></span>
                                        </template>
                                    </div>
                                </div>

                                <div x-show="detailCast.length">
                                    <h3 class="text-lg font-semibold mb-4">Cast</h3>
                                    <div class="flex gap-4 overflow-x-auto pb-2 row-scroll">
                                        <template x-for="person in detailCast.slice(0, 12)" :key="person.id">
                                            <div class="flex-none w-20 text-center">
                                                <img :src="person.profile_path ? 'https://image.tmdb.org/t/p/w185' + person.profile_path : 'https://via.placeholder.com/185x278?text=No+Photo'"
                                                     class="w-20 h-20 object-cover rounded-full mb-2 bg-[#1f1f1f]" :alt="person.name" loading="lazy">
                                                <p class="text-xs font-medium line-clamp-1" x-text="person.name"></p>
                                                <p class="text-[11px] text-gray-400 line-clamp-1" x-text="person.character"></p>
                                            </div>
                                        </template>
                                    </div>
                                </div>

                                <div x-show="detailSimilar.length" class="pt-2">
                                    <h3 class="text-lg font-semibold mb-4">More Like This</h3>
                                    <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3">
                                        <template x-for="item in detailSimilar.slice(0, 8)" :key="item.id">
                                            <div @click="openDetail(item.id, detailType)"
                                                 class="cursor-pointer group overflow-hidden rounded-xl">
                                                <img :src="item.poster_path ? 'https://image.tmdb.org/t/p/w500' + item.poster_path : 'https://via.placeholder.com/500x750?text=No+Poster'"
                                                     class="w-full aspect-[2/3] object-cover transition group-hover:opacity-80" :alt="item.title || item.name" loading="lazy">
                                                <p class="text-xs mt-1.5 line-clamp-1 text-gray-300" x-text="item.title || item.name"></p>
                                            </div>
                                        </template>
                                    </div>
                                </div>
                            </div>

                            <div class="space-y-5 text-sm">
                                <div>
                                    <span class="text-gray-400">Status</span>
                                    <span class="ml-2" x-text="detailMovie.status || 'N/A'"></span>
                                </div>
                                <div x-show="detailMovie.budget">
                                    <span class="text-gray-400">Budget</span>
                                    <span class="ml-2" x-text="'$' + (detailMovie.budget / 1000000).toFixed(1) + 'M'"></span>
                                </div>
                                <div x-show="detailMovie.revenue">
                                    <span class="text-gray-400">Revenue</span>
                                    <span class="ml-2" x-text="'$' + (detailMovie.revenue / 1000000).toFixed(1) + 'M'"></span>
                                </div>
                                <div x-show="detailMovie.production_companies && detailMovie.production_companies.length">
                                    <span class="text-gray-400 block mb-1">Production</span>
                                    <template x-for="company in (detailMovie.production_companies || []).slice(0, 4)" :key="company.id">
                                        <span class="block text-gray-200" x-text="company.name"></span>
                                    </template>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </template>
        </div>
    </template>

    <template x-if="!showDetail && !showPlayer">
        <div>
            <div class="nf-hero" x-show="!searchQuery && heroSlides.length"
                 @mouseenter="pauseHero()" @mouseleave="resumeHero()">
                <template x-for="(slide, i) in heroSlides" :key="slide.id">
                    <img :src="'https://image.tmdb.org/t/p/original' + slide.backdrop_path"
                         class="nf-hero-bg" :class="{ 'is-active': i === heroIndex }" alt="" loading="eager">
                </template>
                <div class="absolute inset-0 hero-gradient"></div>
                <div class="nf-hero-content" :class="{ 'is-fading': heroFading }">
                    <h2 class="nf-hero-title" x-text="featured ? (featured.title || featured.name) : ''"></h2>
                    <p class="nf-hero-desc" x-text="featured ? featured.overview : ''"></p>
                    <div class="nf-hero-btns">
                        <button @click="openDetail(featured.id, currentTab === 'movies' ? 'movie' : 'tv')" class="btn-accent">
                            ▶ Play
                        </button>
                        <button @click="openDetail(featured.id, currentTab === 'movies' ? 'movie' : 'tv')" class="btn-secondary">
                            ℹ More Info
                        </button>
                    </div>
                </div>
                <div class="nf-hero-dots" x-show="heroSlides.length > 1">
                    <template x-for="(slide, i) in heroSlides" :key="'dot-'+slide.id">
                        <button type="button" class="nf-hero-dot" :class="{ 'is-active': i === heroIndex }"
                                @click="goToHero(i)" :aria-label="'Slide ' + (i+1)"></button>
                    </template>
                </div>
            </div>

            <div class="nf-rows" :style="(searchQuery || !heroSlides.length) ? 'padding-top: 88px; margin-top: 0;' : ''">
                <div class="flex sm:hidden gap-3 mb-4 px-[4%] pt-4">
                    <button @click="switchTab('movies')"
                            :class="currentTab === 'movies' ? 'bg-white text-black' : 'bg-black text-white border border-[#222]'"
                            class="px-5 py-2 rounded-xl text-sm font-medium">Movies</button>
                    <button @click="switchTab('shows')"
                            :class="currentTab === 'shows' ? 'bg-white text-black' : 'bg-black text-white border border-[#222]'"
                            class="px-5 py-2 rounded-xl text-sm font-medium">TV Shows</button>
                </div>

                <div x-show="loading && !content.length" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-2 px-[4%]">
                    <template x-for="n in 12" :key="n">
                        <div class="skeleton aspect-[2/3] rounded-xl"></div>
                    </template>
                </div>

                <div x-show="!loading && !content.length" class="text-center text-gray-400 py-20">
                    <p class="text-lg">No titles found.</p>
                    <p class="text-sm mt-2">Try a different search or genre.</p>
                </div>

                <template x-if="searchQuery && content.length">
                    <div class="nf-row">
                        <h2 class="nf-row-title">Results for “<span x-text="searchQuery"></span>”</h2>
                        <div class="nf-grid">
                            <template x-for="item in content" :key="item.id">
                                <div @click="openDetail(item.id, currentTab === 'movies' ? 'movie' : 'tv')" class="nf-grid-card">
                                    <img :src="item.poster_path ? 'https://image.tmdb.org/t/p/w500' + item.poster_path : 'https://via.placeholder.com/500x750?text=No+Poster'"
                                         :alt="item.title || item.name" loading="lazy">
                                    <div class="nf-card-info">
                                        <h3 x-text="item.title || item.name"></h3>
                                        <p x-text="(item.release_date || item.first_air_date || '').slice(0,4) + ' · ★ ' + (item.vote_average ? item.vote_average.toFixed(1) : 'N/A')"></p>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </div>
                </template>

                <template x-if="!searchQuery && content.length">
                    <div>
                        <div class="nf-row">
                            <h2 class="nf-row-title">
                                <span x-text="selectedGenre ? (genres.find(g => g.id == selectedGenre)?.name || 'Filtered') : (currentTab === 'movies' ? 'Popular on BlackHole' : 'Popular TV Shows')"></span>
                            </h2>
                            <div class="nf-row-track">
                                <template x-for="item in content" :key="item.id">
                                    <div @click="openDetail(item.id, currentTab === 'movies' ? 'movie' : 'tv')" class="nf-card">
                                        <img :src="item.poster_path ? 'https://image.tmdb.org/t/p/w500' + item.poster_path : 'https://via.placeholder.com/500x750?text=No+Poster'"
                                             :alt="item.title || item.name" loading="lazy">
                                        <div class="nf-card-info">
                                            <h3 x-text="item.title || item.name"></h3>
                                            <p x-text="(item.release_date || item.first_air_date || '').slice(0,4) + ' · ★ ' + (item.vote_average ? item.vote_average.toFixed(1) : 'N/A')"></p>
                                        </div>
                                    </div>
                                </template>
                            </div>
                        </div>

                        <template x-if="!selectedGenre">
                            <div>
                                <template x-for="row in extraRows" :key="row.name">
                                    <div class="nf-row" x-show="row.items.length">
                                        <h2 class="nf-row-title" x-text="row.name"></h2>
                                        <div class="nf-row-track">
                                            <template x-for="item in row.items" :key="item.id">
                                                <div @click="openDetail(item.id, currentTab === 'movies' ? 'movie' : 'tv')" class="nf-card">
                                                    <img :src="item.poster_path ? 'https://image.tmdb.org/t/p/w500' + item.poster_path : 'https://via.placeholder.com/500x750?text=No+Poster'"
                                                         :alt="item.title || item.name" loading="lazy">
                                                    <div class="nf-card-info">
                                                        <h3 x-text="item.title || item.name"></h3>
                                                        <p x-text="(item.release_date || item.first_air_date || '').slice(0,4) + ' · ★ ' + (item.vote_average ? item.vote_average.toFixed(1) : 'N/A')"></p>
                                                    </div>
                                                </div>
                                            </template>
                                        </div>
                                    </div>
                                </template>
                            </div>
                        </template>
                    </div>
                </template>

                <div class="mt-8 flex justify-center items-center gap-5 px-[4%]" x-show="content.length">
                    <button @click="changePage(currentPage - 1)" :disabled="currentPage === 1"
                            class="btn-secondary disabled:opacity-40 px-5 py-2 text-sm">← Previous</button>
                    <span class="text-gray-400 text-sm">Page <span x-text="currentPage"></span></span>
                    <button @click="changePage(currentPage + 1)" :disabled="currentPage >= totalPages"
                            class="btn-secondary disabled:opacity-40 px-5 py-2 text-sm">Next →</button>
                </div>
            </div>
        </div>
    </template>

    <script>
        (function() {
            const adSelectors = [
                'iframe[src*="ads"]', 'iframe[src*="doubleclick"]', 'iframe[src*="googlesyndication"]',
                'iframe[src*="adnxs"]', 'iframe[src*="adserver"]',
                '[id*="ad-"]', '[id*="ads-"]', '[class*="ad-"]', '[class*="ads-"]',
                '[class*="advert"]', '.adsbygoogle'
            ];
            function removeAds() {
                adSelectors.forEach(selector => {
                    document.querySelectorAll(selector).forEach(el => {
                        if (el.classList.contains('player-iframe')) return;
                        el.remove();
                    });
                });
            }
            removeAds();
            setInterval(removeAds, 2000);
        })();

        function app() {
            return {
                apiKey: 'fb7bb23f03b6994dafc674c074d01761',
                apiBase: 'https://api.themoviedb.org/3',
                content: [],
                genres: [],
                extraRows: [],
                featured: null,
                heroSlides: [],
                heroIndex: 0,
                heroFading: false,
                heroTimer: null,
                heroPaused: false,
                currentTab: 'movies',
                currentPage: 1,
                totalPages: 1,
                searchQuery: '',
                selectedGenre: '',
                sortBy: 'popularity.desc',
                scrolled: false,
                loading: false,
                toast: '',
                showDetail: false,
                showPlayer: false,
                showTopBar: false,
                topBarTimer: null,
                detailLoading: false,
                detailError: null,
                detailMovie: null,
                detailCast: [],
                detailSimilar: [],
                detailType: 'movie',
                _contentReqId: 0,
                _detailReqId: 0,
                _searchTimer: null,
                _rowsReqId: 0,

                get playerUrl() {
                    if (!this.detailMovie) return '';
                    const id = this.detailMovie.id;
                    if (this.detailType === 'tv') {
                        return `https://vidcore.io/tv/${id}/1/1`;
                    }
                    return `https://vidcore.io/movie/${id}`;
                },

                async init() {
                    window.addEventListener('scroll', () => {
                        this.scrolled = window.scrollY > 40;
                    });
                    await this.fetchGenres();
                    await this.fetchContent();
                    this.loadExtraRows();
                },

                setupHero(items) {
                    this.stopHero();
                    const slides = (items || []).filter(i => i.backdrop_path).slice(0, 8);
                    this.heroSlides = slides;
                    this.heroIndex = 0;
                    this.featured = slides[0] || null;
                    this.heroFading = false;
                    if (slides.length > 1) this.startHero();
                },

                startHero() {
                    this.stopHero();
                    this.heroTimer = setInterval(() => {
                        if (!this.heroPaused) this.nextHero();
                    }, 7000);
                },

                stopHero() {
                    if (this.heroTimer) {
                        clearInterval(this.heroTimer);
                        this.heroTimer = null;
                    }
                },

                pauseHero() { this.heroPaused = true; },
                resumeHero() { this.heroPaused = false; },

                nextHero() {
                    if (!this.heroSlides.length) return;
                    this.heroFading = true;
                    setTimeout(() => {
                        this.heroIndex = (this.heroIndex + 1) % this.heroSlides.length;
                        this.featured = this.heroSlides[this.heroIndex];
                        this.heroFading = false;
                    }, 400);
                },

                goToHero(i) {
                    if (i === this.heroIndex || !this.heroSlides[i]) return;
                    this.heroFading = true;
                    setTimeout(() => {
                        this.heroIndex = i;
                        this.featured = this.heroSlides[i];
                        this.heroFading = false;
                    }, 400);
                    this.startHero();
                },

                showToast(msg) {
                    this.toast = msg;
                    clearTimeout(this._toastTimer);
                    this._toastTimer = setTimeout(() => { this.toast = ''; }, 4000);
                },

                async tmdbFetch(path, params = {}) {
                    const url = new URL(this.apiBase + path);
                    url.searchParams.set('api_key', this.apiKey);
                    for (const [k, v] of Object.entries(params)) {
                        if (v !== undefined && v !== null && v !== '') url.searchParams.set(k, v);
                    }
                    const res = await fetch(url.toString());
                    if (!res.ok) {
                        let detail = '';
                        try { detail = (await res.json()).status_message || ''; } catch (e) {}
                        throw new Error(`TMDB request failed (${res.status}) ${detail}`.trim());
                    }
                    return res.json();
                },

                async openDetail(id, type) {
                    if (!id) return;
                    this.showDetail = true;
                    this.showPlayer = false;
                    this.detailLoading = true;
                    this.detailError = null;
                    this.detailMovie = null;
                    this.detailCast = [];
                    this.detailSimilar = [];
                    this.detailType = type;
                    window.scrollTo({ top: 0 });
                    const reqId = ++this._detailReqId;
                    try {
                        const [movie, credits, similar] = await Promise.all([
                            this.tmdbFetch(`/${type}/${id}`),
                            this.tmdbFetch(`/${type}/${id}/credits`).catch(() => ({ cast: [] })),
                            this.tmdbFetch(`/${type}/${id}/similar`).catch(() => ({ results: [] })),
                        ]);
                        if (reqId !== this._detailReqId) return;
                        this.detailMovie = movie;
                        this.detailCast = credits.cast || [];
                        this.detailSimilar = similar.results || [];
                        document.title = `${movie.title || movie.name} · BlackHole Theater`;
                    } catch (e) {
                        if (reqId !== this._detailReqId) return;
                        this.detailError = e.message || 'Could not load this title.';
                    } finally {
                        if (reqId === this._detailReqId) this.detailLoading = false;
                    }
                },

                closeDetail() {
                    this.showDetail = false;
                    this.showPlayer = false;
                    this.detailMovie = null;
                    document.title = 'BlackHole Theater';
                    window.scrollTo({ top: 0 });
                },

                async switchTab(tab) {
                    const sameTab = this.currentTab === tab;
                    this.currentTab = tab;
                    this.currentPage = 1;
                    this.totalPages = 1;
                    this.selectedGenre = '';
                    this.sortBy = 'popularity.desc';
                    if (sameTab) this.searchQuery = '';
                    clearTimeout(this._searchTimer);
                    this.stopHero();
                    this.featured = null;
                    this.heroSlides = [];
                    this.extraRows = [];
                    this.content = [];
                    this.loading = true;
                    window.scrollTo({ top: 0 });
                    try {
                        await this.fetchGenres();
                        if (this.searchQuery.trim()) {
                            await this.searchContent();
                        } else {
                            await this.fetchContent();
                            this.loadExtraRows();
                        }
                    } catch (e) {
                        this.showToast(e.message || 'Could not switch tabs.');
                    } finally {
                        this.loading = false;
                    }
                },

                async fetchGenres() {
                    const type = this.currentTab === 'movies' ? 'movie' : 'tv';
                    try {
                        const data = await this.tmdbFetch(`/genre/${type}/list`);
                        this.genres = data.genres || [];
                    } catch (e) {
                        this.genres = [];
                    }
                },

                async fetchContent() {
                    const type = this.currentTab === 'movies' ? 'movie' : 'tv';
                    const reqId = ++this._contentReqId;
                    this.loading = true;
                    let sort = this.sortBy;
                    if (type === 'tv') {
                        if (sort === 'release_date.desc') sort = 'first_air_date.desc';
                        if (sort === 'revenue.desc') sort = 'popularity.desc';
                    }
                    try {
                        const data = await this.tmdbFetch(`/discover/${type}`, {
                            sort_by: sort,
                            'vote_count.gte': sort === 'vote_average.desc' ? 300 : undefined,
                            page: this.currentPage,
                            with_genres: this.selectedGenre || undefined,
                        });
                        if (reqId !== this._contentReqId) return;
                        this.content = data.results || [];
                        this.totalPages = Math.min(data.total_pages || 500, 500);
                        if (this.currentPage === 1 && !this.selectedGenre && this.content.length) {
                            this.setupHero(this.content);
                        } else if (this.selectedGenre || this.currentPage > 1) {
                            this.stopHero();
                            this.heroSlides = [];
                            this.featured = this.content[0] || null;
                        }
                    } catch (e) {
                        if (reqId !== this._contentReqId) return;
                        this.content = [];
                        this.showToast(e.message || 'Failed to load content.');
                    } finally {
                        if (reqId === this._contentReqId) this.loading = false;
                    }
                },

                async loadExtraRows() {
                    const type = this.currentTab === 'movies' ? 'movie' : 'tv';
                    const rowsReqId = ++this._rowsReqId;
                    const rows = [
                        { name: 'Top Rated', sort: 'vote_average.desc' },
                        { name: 'Action', genre: 28 },
                        { name: 'Comedy', genre: 35 },
                        { name: 'Drama', genre: 18 },
                        { name: 'Thriller', genre: 53 },
                        { name: 'Science Fiction', genre: 878 },
                        { name: 'Horror', genre: 27 },
                    ];
                    this.extraRows = [];
                    const results = await Promise.all(rows.map(row =>
                        this.tmdbFetch(`/discover/${type}`, {
                            sort_by: row.sort,
                            'vote_count.gte': row.sort ? 300 : undefined,
                            with_genres: row.genre,
                            page: 1,
                        }).then(data => ({ name: row.name, items: (data.results || []).slice(0, 12) }))
                          .catch(() => ({ name: row.name, items: [] }))
                    ));
                    if (rowsReqId !== this._rowsReqId) return;
                    this.extraRows = results.filter(r => r.items.length);
                },

                async searchContent() {
                    if (!this.searchQuery.trim()) {
                        await this.fetchContent();
                        return;
                    }
                    const type = this.currentTab === 'movies' ? 'movie' : 'tv';
                    const reqId = ++this._contentReqId;
                    this.loading = true;
                    try {
                        const data = await this.tmdbFetch(`/search/${type}`, {
                            query: this.searchQuery,
                            page: this.currentPage,
                        });
                        if (reqId !== this._contentReqId) return;
                        let results = data.results || [];
                        if (this.selectedGenre) {
                            results = results.filter(i => i.genre_ids?.includes(Number(this.selectedGenre)));
                        }
                        this.content = results;
                        this.totalPages = Math.min(data.total_pages || 500, 500);
                    } catch (e) {
                        if (reqId !== this._contentReqId) return;
                        this.content = [];
                        this.showToast(e.message || 'Search failed.');
                    } finally {
                        if (reqId === this._contentReqId) this.loading = false;
                    }
                },

                onSearchInput() {
                    clearTimeout(this._searchTimer);
                    this.currentPage = 1;
                    this.totalPages = 1;
                    this.content = [];
                    this.loading = true;
                    if (this.searchQuery.trim()) {
                        this.stopHero();
                        this.heroSlides = [];
                        this.featured = null;
                    }
                    this._searchTimer = setTimeout(() => this.applyFilters(), 400);
                },

                async applyFilters() {
                    this.currentPage = 1;
                    if (this.searchQuery.trim()) {
                        this.stopHero();
                        this.heroSlides = [];
                        this.featured = null;
                        await this.searchContent();
                    } else {
                        await this.fetchContent();
                        if (!this.selectedGenre) this.loadExtraRows();
                    }
                },

                async changePage(page) {
                    if (page < 1) return;
                    this.currentPage = page;
                    if (this.searchQuery.trim()) await this.searchContent();
                    else await this.fetchContent();
                    document.querySelectorAll('.nf-row-track').forEach(el => { el.scrollLeft = 0; });
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                }
            }
        }
    </script>
</body>
</html>
