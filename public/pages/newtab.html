<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>NEW TAB  LOLOLOL</title>
		<link rel="stylesheet" href="/assets/css/font.css?v=2" />
		<link
			rel="stylesheet"
			href="/assets/css/colors/default.css"
			id="csslink"
		/>
		<link rel="stylesheet" href="/assets/css/index.css" />
		<link rel="stylesheet" href="/assets/icons/css/all-pro.css" />
	</head>
	<body class="obfuscate">
		<center>
			<div
				style="
					left: 50%;
					top: 50%;
					transform: translate(-50%, -50%);
					position: fixed;
				"
			>
				<h1 class="hometitle">Singularity</h1>
				<p id="splash"></p>
				<div class="inputcontainer">
					<i class="far fa-search"></i>
					<input
						type="text"
						id="homesearchlol"
						placeholder="Search for anything!"
					/>
					</a>
				</div>
			</div>
		</center>
		<script>
			document.getElementById("csslink").href =
				`/assets/css/colors/${localStorage.getItem("singularity_theme") ?? "default"}.css`;
		</script>
		<script>
			document
				.getElementById("homesearchlol")
				.addEventListener("keydown", (e) => {
					if (e.key === "Enter") {
						let url = document
							.getElementById("homesearchlol")
							.value.trim();
						if (!url.includes(".")) {
							url =
								"https://duckduckgo.com/?q=" + encodeURIComponent(url);
						} else if (
							!url.includes("https://") &&
							!url.includes("http://")
						) {
							url = "https://" + url;
						}
						window.location.href = "/scramjet/" + encodeURIComponent(url);
					}
				});

			function shortcut(url) {
				window.location.href = "/scramjet/" + encodeURIComponent(url);
			}
		</script>
	
</body>
</html>
