	<div id="clock-splash"><iframe id="clock-splash-frame" src="/pages/clock.html" title="Clock" allow="autoplay; fullscreen"></iframe></div>
	<script>
		(function () {
			var el = document.getElementById("clock-splash");
			var frame = document.getElementById("clock-splash-frame");
			window.__clockActive = true;

			var HIDE = "nav#navbar, #nav-grip, #dock-guide { display: none !important; }";
			function guard() {
				try {
					var d = frame.contentDocument;
					if (!d || !d.documentElement) return;
					if (!d.getElementById("sg-hide-nav")) {
						var st = d.createElement("style");
						st.id = "sg-hide-nav";
						st.textContent = HIDE;
						(d.head || d.documentElement).appendChild(st);
					}
					d.querySelectorAll("nav#navbar, #nav-grip, #dock-guide").forEach(function (n) { n.style.setProperty("display", "none", "important"); });
				} catch (e) {}
			}
			var guardTimer = setInterval(guard, 20);

			function addBookIcon() {
				var l = document.createElement("link");
				l.id = "site-icon";
				l.rel = "icon";
				l.type = "image/svg+xml";
				l.href = window.__bookIcon;
				document.head.appendChild(l);
			}
			var iconObs = new MutationObserver(function () {
				var ok = false;
				document.head.querySelectorAll('link[rel~="icon"]').forEach(function (l) {
					if (l.id === "site-icon") {
						if (l.getAttribute("href") !== window.__bookIcon) l.setAttribute("href", window.__bookIcon);
						ok = true;
					} else {
						l.remove();
					}
				});
				if (!ok) addBookIcon();
			});
			iconObs.observe(document.head, { childList: true, subtree: true, attributes: true, attributeFilter: ["href", "rel"] });

			function finish() {
				clearInterval(guardTimer);
				iconObs.disconnect();
				el.remove();
				window.__clockActive = false;
			
				var old = document.getElementById("site-icon");
				var icon = document.createElement("link");
				icon.id = "site-icon";
				icon.rel = "icon";
				icon.href = "/assets/img/fav.png";
				if (old) old.replaceWith(icon); else document.head.appendChild(icon);
			}

			var started = false;
			function start() {
				if (started) return;
				started = true;
				setTimeout(finish, 4000);
			}
			frame.addEventListener("load", function () { guard(); start(); });
			setTimeout(start, 4000); 
		})();
	</script>

	<script>
		(function () {
			if (window.__skipBoot) {
				const v = document.getElementById("boot-video");
				if (v) { v.pause(); v.removeAttribute("src"); v.load(); }
				try { window.parent.postMessage({ type: "singularity-boot", show: false }, "*"); } catch (e) {}
				return;
			}
			const bootVideoEl = document.getElementById("boot-video");
			bootVideoEl.muted = true;
			bootVideoEl.play().catch(() => {});

			function notifyParent(show) {
				if (window.parent && window.parent !== window) {
					try { window.parent.postMessage({ type: "singularity-boot", show }, "*"); } catch (e) {}
				}
			}
			notifyParent(true);

			const timeEl = document.getElementById("boot-time");
			const dateEl = document.getElementById("boot-date");

			function updateBootClock() {
				const now = new Date();
				timeEl.textContent = now.toLocaleTimeString([], { hour: "numeric", minute: "2-digit", hour12: true });
				dateEl.textContent = now.toLocaleDateString([], { weekday: "long", year: "numeric", month: "long", day: "numeric" });
			}
			updateBootClock();
			const bootClockInterval = setInterval(updateBootClock, 1000);

			function dismissBootScreen() {
				if (window.__clockActive) return;
				const bootEl = document.getElementById("boot-screen");
				bootEl.classList.add("unlocking");
				clearInterval(bootClockInterval);
				notifyParent(false);
				try { window.parent.__singularityBooted = true; } catch (e) {}

				document.removeEventListener("click", dismissBootScreen);
				document.removeEventListener("keydown", dismissBootScreen);
				document.removeEventListener("touchstart", dismissBootScreen);

				setTimeout(() => {
					bootEl.style.display = "none";
					bootVideoEl.pause();
					bootVideoEl.removeAttribute("src");
					bootVideoEl.load();
				}, 700);
			}
			document.addEventListener("click", dismissBootScreen);
			document.addEventListener("keydown", dismissBootScreen);
			document.addEventListener("touchstart", dismissBootScreen);
		})();
	</script>

	<script>
		
		let nexusCanvas = null, nexusCtx = null, nexusRaf = null, nexusPts = [], nexusW = 0, nexusH = 0;
		let nexusBound = false;
		const NEXUS_LINK = 110;

		function nexusResize() {
			if (!nexusCanvas) return;
			const dpr = window.devicePixelRatio || 1;
			nexusW = window.innerWidth;
			nexusH = window.innerHeight;
			nexusCanvas.width = nexusW * dpr;
			nexusCanvas.height = nexusH * dpr;
			nexusCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
			const count = Math.max(25, Math.min(90, Math.floor((nexusW * nexusH) / 16000)));
			nexusPts = Array.from({ length: count }, () => ({
				x: Math.random() * nexusW,
				y: Math.random() * nexusH,
				vx: (Math.random() - 0.5) * 0.7,
				vy: (Math.random() - 0.5) * 0.7,
			}));
		}

		function nexusDraw() {
			nexusRaf = requestAnimationFrame(nexusDraw);
			const ctx = nexusCtx;
			ctx.clearRect(0, 0, nexusW, nexusH);

			for (const p of nexusPts) {
				p.x += p.vx;
				p.y += p.vy;
				if (p.x < 0 || p.x > nexusW) p.vx *= -1;
				if (p.y < 0 || p.y > nexusH) p.vy *= -1;
			}

			ctx.lineWidth = 1;
			for (let i = 0; i < nexusPts.length; i++) {
				const p = nexusPts[i];
				for (let j = i + 1; j < nexusPts.length; j++) {
					const q = nexusPts[j];
					const d = Math.hypot(p.x - q.x, p.y - q.y);
					if (d < NEXUS_LINK) {
						ctx.strokeStyle = "rgba(255,255,255," + ((1 - d / NEXUS_LINK) * 0.55).toFixed(3) + ")";
						ctx.beginPath();
						ctx.moveTo(p.x, p.y);
						ctx.lineTo(q.x, q.y);
						ctx.stroke();
					}
				}
			}

			ctx.fillStyle = "rgba(255,255,255,0.6)";
			for (const p of nexusPts) {
				ctx.beginPath();
				ctx.arc(p.x, p.y, 2, 0, Math.PI * 2);
				ctx.fill();
			}
		}

		function startDefaultBg() {
			if (nexusRaf) return;
			nexusCanvas = document.getElementById("nexus-bg");
			nexusCtx = nexusCanvas.getContext("2d");
			nexusCanvas.style.display = "block";
			nexusResize();
			if (!nexusBound) {
				nexusBound = true;
				window.addEventListener("resize", nexusResize);
			}
			nexusRaf = requestAnimationFrame(nexusDraw);
		}

		function stopDefaultBg() {
			if (nexusRaf) { cancelAnimationFrame(nexusRaf); nexusRaf = null; }
			const c = document.getElementById("nexus-bg");
			if (c) c.style.display = "none";
		}
	</script>

	<script>
		const VIDEO_DIR = "/assets/video/backgrounds/";

		function videoSources(file) {
			const m = file.match(/^(.*)\.mp4$/i);
			const names = m ? [file, m[1] + ".mp4", m[1] + ".MP4", m[1].toLowerCase() + ".mp4", m[1].toLowerCase() + ".MP4"] : [file];
			return Array.from(new Set(names)).map((n) => VIDEO_DIR + n);
		}

		function createVideoBackground(sources, loop = true) {
			const video = document.createElement("video");
			let i = 0;
			video.autoplay = true;
			video.muted = true;
			video.loop = loop;
			video.playsInline = true;
			video.setAttribute("tabindex", "-1");
			video.className = "position-fixed top-0 start-0 vw-100 vh-100 object-fit-cover pe-none";
			video.style.zIndex = "-3";
			video.addEventListener("error", () => {
				i++;
				if (i < sources.length) { video.src = sources[i]; video.play().catch(() => {}); }
				else console.warn("Background video failed to load:", sources);
			});
			video.src = sources[0];
			document.body.appendChild(video);
			video.play().catch(() => {});
			return function stop() { video.pause(); video.remove(); };
		}

		const videoBg = (id, name, file, loop = true) => ({
			id, name, type: "video", sources: videoSources(file),
			start() { return createVideoBackground(this.sources, loop); },
		});

		const CODED_BACKGROUNDS = [
			{ ...videoBg("waves", "Waves", "waves.mp4"), swatchColors: ["#7c2dff", "#ff3ec8"] },
			videoBg("Winter", "Winter", "winter.mp4"),
			videoBg("f-1", "F-1", "f-1.mp4"),
			videoBg("cherri", "Cherri", "cherri.mp4"),
			videoBg("Halloween", "Halloween", "Halloween.mp4"),
			videoBg("Skello", "Skello", "skello.MP4", false),
			videoBg("Hide", "Hide", "hide.mp4", false),
			videoBg("Void", "Void", "void.mp4"),
			videoBg("cine", "Cine", "cine.mp4"),
			videoBg("spooky", "Spooky", "spooky.mp4"),
			{
				id: "desolation",
				name: "Desolation",
				swatchColors: ["#1b3fd9", "#6d28d9"],
				start(canvas) {
					const ctx = canvas.getContext("2d");
					let width, height, frameId, gradient, vignette;
					let orbs = [];

					function makeOrb(anywhere) {
						return {
							x: Math.random() * width,
							y: anywhere ? Math.random() * height : height + Math.random() * 30,
							r: Math.random() * 2.2 + 0.8,
							vy: -(Math.random() * 0.7 + 0.25),
							vx: (Math.random() - 0.5) * 1.2,
							opacity: Math.random() * 0.5 + 0.4,
						};
					}

					function resize() {
						width = canvas.width = canvas.clientWidth || window.innerWidth;
						height = canvas.height = canvas.clientHeight || window.innerHeight;
						gradient = ctx.createLinearGradient(0, 0, 0, height);
						gradient.addColorStop(0, "#1b3fd9");
						gradient.addColorStop(0.5, "#6d28d9");
						gradient.addColorStop(1, "#2a1066");
						vignette = ctx.createRadialGradient(width / 2, height * 0.3, Math.min(width, height) * 0.2, width / 2, height * 0.3, Math.max(width, height) * 0.85);
						vignette.addColorStop(0, "rgba(0, 0, 0, 0)");
						vignette.addColorStop(1, "rgba(0, 0, 0, 0.5)");
						const count = Math.floor((width * height) / 9000);
						orbs = Array.from({ length: count }, () => makeOrb(true));
					}
					resize();
					window.addEventListener("resize", resize);

					function draw() {
						ctx.fillStyle = gradient;
						ctx.fillRect(0, 0, width, height);
						ctx.fillStyle = vignette;
						ctx.fillRect(0, 0, width, height);
						ctx.shadowColor = "rgba(200, 215, 255, 1)";
						ctx.shadowBlur = 18;

						for (let i = 0; i < orbs.length; i++) {
							let o = orbs[i];
							o.vx += (Math.random() - 0.5) * 0.08;
							o.vx = Math.max(-1, Math.min(1, o.vx));
							o.x += o.vx;
							o.y += o.vy;
							if (o.x < -10) o.x = width + 10;
							if (o.x > width + 10) o.x = -10;
							if (o.y < -10) { o = orbs[i] = makeOrb(false); } 

							ctx.beginPath();
							ctx.globalAlpha = o.opacity;
							ctx.fillStyle = "#ffffff";
							ctx.arc(o.x, o.y, o.r, 0, Math.PI * 2);
							ctx.fill();
						}
						ctx.globalAlpha = 1;
						ctx.shadowBlur = 0;
						frameId = requestAnimationFrame(draw);
					}
					draw();

					return function stop() {
						cancelAnimationFrame(frameId);
						window.removeEventListener("resize", resize);
					};
				},
			},
			{
				id: "rain",
				name: "Rain",
				swatchColors: ["#3a4a5a", "#8fa8c2"],
				start(canvas) {
					const ctx = canvas.getContext("2d");
					let width, height, frameId;
					let drops = [];

					function resize() {
						width = canvas.width = canvas.clientWidth || window.innerWidth;
						height = canvas.height = canvas.clientHeight || window.innerHeight;
						const count = Math.floor((width * height) / 9000);
						drops = Array.from({ length: count }, () => ({
							x: Math.random() * width,
							y: Math.random() * height,
							len: Math.random() * 18 + 10,
							speed: Math.random() * 6 + 6,
							opacity: Math.random() * 0.4 + 0.2,
						}));
					}
					resize();
					window.addEventListener("resize", resize);

					function draw() {
						ctx.fillStyle = "#0d1117";
						ctx.fillRect(0, 0, width, height);
						drops.forEach((d) => {
							ctx.beginPath();
							ctx.globalAlpha = d.opacity;
							ctx.strokeStyle = "rgba(180, 200, 220, 0.9)";
							ctx.lineWidth = 1;
							ctx.moveTo(d.x, d.y);
							ctx.lineTo(d.x, d.y + d.len);
							ctx.stroke();
							d.y += d.speed;
							if (d.y > height) { d.y = -d.len; d.x = Math.random() * width; }
						});
						ctx.globalAlpha = 1;
						frameId = requestAnimationFrame(draw);
					}
					draw();

					return function stop() {
						cancelAnimationFrame(frameId);
						window.removeEventListener("resize", resize);
					};
				},
			},
		];

		const TITLE_COLORS = [

			const entry = id && CODED_BACKGROUNDS.find((b) => b.id === id);

			["stars", "Stars", '<polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>'],
			["cyber", "Cyber", '<polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>'],

		];

		let cloudTheme = store.get("cloud_theme") || "dark";
		if (!CLOUD_THEMES[cloudTheme]) cloudTheme = "dark";
		let cpType = store.get("cloud_particles") || "none";
		if (!CLOUD_PARTICLES.some((p) => p[0] === cpType)) cpType = "none";
		const cloudW = () => { const u = document.getElementById("cloud-ui"); return (u && u.clientWidth) || window.innerWidth; };
		const cloudH = () => { const u = document.getElementById("cloud-ui"); return (u && u.clientHeight) || window.innerHeight; };
		let cpArr = [], cpCanvas = null, cpCtx = null, cpRaf = null, cpMX = -9999, cpMY = -9999;

		const COVER_OVERRIDES = {
			"Deltarune": [
				"https://cdn.akamai.steamstatic.com/steam/apps/1671210/library_600x900.jpg",
				"https://cdn.cloudflare.steamstatic.com/steam/apps/1671210/library_600x900.jpg",
			],
			"Minecraft": ["https://upload.wikimedia.org/wikipedia/en/5/51/Minecraft_cover.png"],
		};

		function tryImageSources(img, sources, onAllFailed) {
			let i = 0;
			img.onerror = () => {
				i++;
				if (i < sources.length) img.src = sources[i];
				else { img.onerror = null; img.removeAttribute("src"); if (onAllFailed) onAllFailed(); }
			};
			img.src = sources[0];
		}

		async function loadCloudCover(g, img) {
			img.referrerPolicy = "no-referrer";
			if (COVER_OVERRIDES[g.wiki]) { tryImageSources(img, COVER_OVERRIDES[g.wiki]); return; }

			const key = "cloud_cover_" + g.wiki;
			const cached = store.get(key);
			if (cached) {
				tryImageSources(img, [cached], () => store.remove(key));
				return;
			}
			try {
				const r = await fetch("https://en.wikipedia.org/api/rest_v1/page/summary/" + g.wiki);
				if (!r.ok) return;
				const d = await r.json();
				const src = (d.originalimage && d.originalimage.source) || (d.thumbnail && d.thumbnail.source);
				if (src) { tryImageSources(img, [src]); store.set(key, src); }
			} catch (e) {}
		}

		function setCloudTheme(t) {
			const th = CLOUD_THEMES[t] || CLOUD_THEMES.dark;
			const ui = document.getElementById("cloud-ui");
			ui.style.setProperty("--cbg", th[0]);
			ui.style.setProperty("--caccent", th[1]);
			ui.style.setProperty("--cborder", th[2]);
			cloudTheme = t;
			store.set("cloud_theme", t);
			ui.querySelectorAll(".cloud-swatch").forEach((e) => e.classList.toggle("active", e.dataset.theme === t));
		}

		let cmWidth = 0, cmHeight = 0, cmColumns = 0, cmDrops = [], cmInterval = null;
		const cmFontSize = 16;

		function cpResize() {
			if (!cpCanvas) return;
			cpCtx = cpCanvas.getContext("2d");
			if (cpType === "matrix") {
				cpCanvas.style.mixBlendMode = "screen";
				cpCanvas.style.width = "";
				cpCanvas.style.height = "";
				cmWidth = cpCanvas.width = cloudW();
				cmHeight = cpCanvas.height = cloudH();
				cmColumns = Math.floor(cmWidth / cmFontSize);
				cmDrops = new Array(cmColumns).fill(0).map(() => Math.random() * -100);
				cpArr = [];
				return;
			}
			cpCanvas.style.mixBlendMode = "";
			const dpr = window.devicePixelRatio || 1;
			cpCanvas.width = cloudW() * dpr;
			cpCanvas.height = cloudH() * dpr;
			cpCanvas.style.width = cloudW() + "px";
			cpCanvas.style.height = cloudH() + "px";
			cpCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
			cpInit();
		}

		function cloudMatrixDraw() {
			const ui = document.getElementById("cloud-ui");
			if (!ui || !ui.classList.contains("open") || cpType !== "matrix") { cloudMatrixStop(); return; }
			cpCtx.fillStyle = "rgba(0, 0, 0, 0.08)";
			cpCtx.fillRect(0, 0, cmWidth, cmHeight);
			cpCtx.font = cmFontSize + "px monospace";
			for (let i = 0; i < cmColumns; i++) {
				const char = Math.random() > 0.5 ? "1" : "0";
				const x = i * cmFontSize;
				const y = cmDrops[i] * cmFontSize;
				cpCtx.fillStyle = Math.random() > 0.95 ? "#aaffaa" : "#00ff00";
				cpCtx.fillText(char, x, y);
				if (y > cmHeight && Math.random() > 0.975) cmDrops[i] = 0;
				cmDrops[i]++;
			}
		}
		function cloudMatrixStart() { if (cmInterval || cpType !== "matrix") return; cmInterval = setInterval(cloudMatrixDraw, 45); }
		function cloudMatrixStop() { if (cmInterval) { clearInterval(cmInterval); cmInterval = null; } }

		function cpInit() {
			cpArr = [];
			if (cpType === "none" || cpType === "matrix") return;
			const cnt = (cpType === "snow" || cpType === "rain") ? 80 : (cpType === "fireflies" || cpType === "nexus") ? 60 : 30;
			const rnd = Math.random;
			for (let i = 0; i < cnt; i++) {
				cpArr.push({
					x: rnd() * cloudW(),
					y: rnd() * cloudH(),
					r: cpType === "snow" ? rnd() * 2 + 1 : cpType === "stars" ? rnd() * 1.5 + 0.5 : cpType === "bubbles" ? rnd() * 4 + 2 : cpType === "fireflies" ? rnd() * 2 + 1.5 : 2,
					vy: cpType === "snow" ? rnd() + 0.5 : cpType === "rain" ? rnd() * 15 + 10 : cpType === "bubbles" ? -(rnd() * 2 + 1) : cpType === "fireflies" ? rnd() * 2 - 1 : cpType === "nexus" ? rnd() - 0.5 : 0,
					vx: cpType === "snow" ? rnd() * 0.8 - 0.4 : cpType === "cyber" ? rnd() * 5 + 3 : cpType === "bubbles" ? rnd() - 0.5 : cpType === "fireflies" ? rnd() * 2 - 1 : cpType === "nexus" ? rnd() - 0.5 : 0,
					l: cpType === "rain" ? rnd() * 20 + 10 : cpType === "cyber" ? rnd() * 50 + 20 : 0,
					c: cpType === "cyber" ? "rgba(0,210,255,0.4)" : cpType === "stars" ? "#fff" : cpType === "bubbles" ? "rgba(255,255,255,0.2)" : cpType === "fireflies" ? "rgba(255,255,100,0.8)" : cpType === "nexus" ? "rgba(255,255,255,0.4)" : "rgba(255,255,255,0.5)",
					o: 0.1 + rnd() * 0.9,       
					do: rnd() * 0.02 + 0.01,
				});
			}
		}

		function cpFrame() {
			const ui = document.getElementById("cloud-ui");
			if (!ui || !ui.classList.contains("open")) { cpRaf = null; return; }
			cpRaf = requestAnimationFrame(cpFrame);
			if (!cpCtx || cpType === "matrix") return;
			cpCtx.clearRect(0, 0, cloudW(), cloudH());
			if (cpType === "none") return;

			const W = cloudW(), H = cloudH();
			cpArr.forEach((p) => {
				cpCtx.beginPath();
				if (cpType === "rain" || cpType === "cyber") {
					cpCtx.rect(p.x, p.y, cpType === "rain" ? 1 : p.l, cpType === "rain" ? p.l : 1);
					cpCtx.fillStyle = p.c;
				} else {
					cpCtx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
					cpCtx.fillStyle = p.c;
					if (cpType === "bubbles") { cpCtx.strokeStyle = "rgba(255,255,255,0.4)"; cpCtx.stroke(); cpCtx.fillStyle = "transparent"; }
				}
				if (cpType === "stars" || cpType === "fireflies") {
					p.o += p.do;
					if (p.o >= 1) p.do = -Math.abs(p.do);
					else if (p.o <= 0.1) p.do = Math.abs(p.do);
					cpCtx.globalAlpha = Math.max(0.1, Math.min(1, p.o));
				}
				cpCtx.fill();
				cpCtx.globalAlpha = 1;

				if (cpType === "fireflies") {
					const dx = cpMX - p.x, dy = cpMY - p.y;
					if (Math.hypot(dx, dy) < 100) { p.vx -= dx * 0.005; p.vy -= dy * 0.005; }
					p.vx += (Math.random() - 0.5) * 0.1;
					p.vy += (Math.random() - 0.5) * 0.1;
					const s = Math.hypot(p.vx, p.vy);
					if (s > 1.5) { p.vx *= 1.5 / s; p.vy *= 1.5 / s; }
				}
				if (cpType === "nexus") {
					const dx = cpMX - p.x, dy = cpMY - p.y;
					if (Math.hypot(dx, dy) < 150) { p.x -= dx * 0.02; p.y -= dy * 0.02; }
					cpArr.forEach((p2) => {
						const d2 = Math.hypot(p2.x - p.x, p2.y - p.y);
						if (d2 < 80) {
							cpCtx.beginPath();
							cpCtx.moveTo(p.x, p.y);
							cpCtx.lineTo(p2.x, p2.y);
							cpCtx.strokeStyle = `rgba(255,255,255,${1 - d2 / 80})`;
							cpCtx.stroke();
						}
					});
				}

				p.x += p.vx;
				p.y += p.vy;
				if (cpType === "snow" || cpType === "rain") { if (p.y > H) { p.y = -20; p.x = Math.random() * W; } }
				else if (cpType === "cyber") { if (p.x > W) { p.x = -100; p.y = Math.random() * H; } }
				else if (cpType === "bubbles") { if (p.y < 0) { p.y = H + 20; p.x = Math.random() * W; } }
				else if (cpType === "fireflies" || cpType === "nexus") {
					if (p.x < 0 || p.x > W) p.vx *= -1;
					if (p.y < 0 || p.y > H) p.vy *= -1;
				}
			});
		}

		function setCloudParticles(t) {
			cloudMatrixStop();
			cpType = t;
			store.set("cloud_particles", t);
			cpResize();
			cloudMatrixStart();
			document.querySelectorAll(".cloud-pcard[data-p]").forEach((e) => e.classList.toggle("active", e.dataset.p === t));
		}

		function toggleCloudSettings(force) {
			const el = document.getElementById("cloud-settings");
			const show = typeof force === "boolean" ? force : !el.classList.contains("show");
			el.classList.toggle("show", show);
		}

		
		let cloudCards = [], cloudSelectedIndex = 0, cloudScrollLock = false, cloudScrollTimer = null, cloudLockTimer = null;

		function cloudInGame() {
			const g = document.getElementById("cloud-game");
			return !!g && g.style.display === "flex";
		}

		function selectCloudCard(index, opts) {
			if (!cloudCards.length) return;
			const o = Object.assign({ scroll: true, focus: true }, opts);
			cloudSelectedIndex = (index + cloudCards.length) % cloudCards.length;
			cloudCards.forEach((card, i) => {
				card.classList.toggle("cloud-selected", i === cloudSelectedIndex);
				card.classList.toggle("cloud-before", i < cloudSelectedIndex);
				card.classList.toggle("cloud-after", i > cloudSelectedIndex);
			});
			const card = cloudCards[cloudSelectedIndex];
			if (o.focus) card.focus({ preventScroll: true });
			if (o.scroll) {
			
				cloudScrollLock = true;
				clearTimeout(cloudLockTimer);
				cloudLockTimer = setTimeout(() => { cloudScrollLock = false; }, 500);
				card.scrollIntoView({ behavior: "smooth", block: "nearest", inline: "center" });
			}
		}

		function selectNearestCloudCard() {
			const menu = document.getElementById("cloud-menu");
			if (!menu || cloudScrollLock || !cloudCards.length) return;
			const mid = menu.scrollLeft + menu.clientWidth / 2;
			let best = 0, bestDist = Infinity;
			cloudCards.forEach((c, i) => {
				const d = Math.abs(c.offsetLeft + c.offsetWidth / 2 - mid);
				if (d < bestDist) { bestDist = d; best = i; }
			});
			if (best !== cloudSelectedIndex) selectCloudCard(best, { scroll: false, focus: false });
		}

		function buildCloudUI() {
			const ui = document.createElement("div");
			ui.id = "cloud-ui";
			ui.innerHTML =
				'<canvas id="cloud-particles"></canvas>' +
				'<button id="cloud-gear" type="button" title="Settings"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>' +
				'<div id="cloud-top-trigger"></div>' +
				'<div id="cloud-hud">' +
					'<div class="cloud-hud-btn" id="cloud-back" style="display:none"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>Games</div>' +
					'<div class="cloud-hud-btn" id="cloud-close"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>Close</div>' +
				'</div>' +
				'<div id="cloud-menu"></div>' +

				'<div id="cloud-settings"><div class="cloud-set-box">' +
					'<h3>Themes</h3><div class="cloud-row" id="cloud-swatches"></div>' +
					'<h3>Particles</h3><div class="cloud-row" id="cloud-pcards" style="margin-bottom:0"></div>' +
				'</div></div>';
			document.getElementById("sg-panes").appendChild(ui);

			cpCanvas = ui.querySelector("#cloud-particles");
			cpCtx = cpCanvas.getContext("2d");

			const menu = ui.querySelector("#cloud-menu");
			CLOUD_GAMES.forEach((g) => {
				const card = document.createElement("div");
				card.className = "cloud-card";

				card.setAttribute("role", "button");
				card.setAttribute("aria-label", g.name);
				const img = document.createElement("img");
				img.alt = "";
				img.draggable = false;
				const name = document.createElement("div");
				name.className = "cloud-name";
				name.textContent = g.name;
				card.appendChild(img);
				card.appendChild(name);
				menu.appendChild(card);
				loadCloudCover(g, img);
			});

			
			cloudCards = Array.from(menu.querySelectorAll(".cloud-card"));
			cloudCards.forEach((card, index) => {
				card.addEventListener("click", () => {
					
					if (index !== cloudSelectedIndex) selectCloudCard(index);
					else launchCloudGame(CLOUD_GAMES[index]);
				});
				card.addEventListener("dblclick", () => launchCloudGame(CLOUD_GAMES[index]));
				card.addEventListener("focus", () => { if (index !== cloudSelectedIndex) selectCloudCard(index, { scroll: true, focus: false }); });
				card.addEventListener("keydown", (e) => {
					if (e.key === "Enter" || e.key === " ") { e.preventDefault(); launchCloudGame(CLOUD_GAMES[index]); }
				});
			});
			menu.addEventListener("scroll", () => {
				clearTimeout(cloudScrollTimer);
				cloudScrollTimer = setTimeout(selectNearestCloudCard, 90);
			}, { passive: true });
			selectCloudCard(0, { scroll: false, focus: false });

			
			document.addEventListener("keydown", (e) => {
				if (!ui.classList.contains("open") || cloudInGame()) return;
				if (document.getElementById("cloud-settings").classList.contains("show")) return;
				if (e.altKey || e.ctrlKey || e.metaKey) return;
				if (e.key === "ArrowRight") { e.preventDefault(); selectCloudCard(cloudSelectedIndex + 1); }
				else if (e.key === "ArrowLeft") { e.preventDefault(); selectCloudCard(cloudSelectedIndex - 1); }
			});

			const sw = ui.querySelector("#cloud-swatches");
			Object.keys(CLOUD_THEMES).forEach((t) => {
				const b = document.createElement("div");
				b.className = "cloud-swatch";
				b.dataset.theme = t;
				b.title = t;
				b.style.background = CLOUD_THEMES[t][3];
				b.onclick = () => setCloudTheme(t);
				sw.appendChild(b);
			});

			const pc = ui.querySelector("#cloud-pcards");

				c.className = "cloud-pcard";
				c.dataset.p = id;
				c.innerHTML = '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke-width="2">' + icon + '</svg><span>' + label + '</span>';
				c.onclick = () => setCloudParticles(id);
				pc.appendChild(c);
			});

			ui.querySelector("#cloud-close").onclick = closeCloud;
			ui.querySelector("#cloud-back").onclick = showCloudMenu;

			trig.addEventListener("mouseenter", hudShow);
			trig.addEventListener("mouseleave", hudHide);
			hud.addEventListener("mouseenter", hudShow);
			hud.addEventListener("mouseleave", hudHide);
			trig.addEventListener("click", () => (hud.classList.contains("show") ? hudHide() : hudShow()));

			ui.querySelector("#cloud-settings").addEventListener("click", (e) => {
				if (e.target.id === "cloud-settings") toggleCloudSettings(false);

			document.addEventListener("keydown", (e) => {
				if (e.key !== "Escape" || !ui.classList.contains("open")) return;

				if (settings.classList.contains("show")) toggleCloudSettings(false);
				else if (cloudInGame()) showCloudMenu();
				else closeCloud();

			setCloudTheme(cloudTheme);
			setCloudParticles(cpType);
			return ui;
		}

		function showCloudMenu() {
			const frame = document.getElementById("cloud-frame");
			frame.src = "about:blank";
			document.getElementById("cloud-game").style.display = "none";
			document.getElementById("cloud-menu").style.display = "flex";
			document.getElementById("cloud-back").style.display = "none";
			document.getElementById("cloud-gear").style.display = "flex";
			document.getElementById("cloud-hud").classList.remove("show");
			if (document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(() => {});
			
			requestAnimationFrame(() => selectCloudCard(cloudSelectedIndex, { scroll: false, focus: true }));
			requestAnimationFrame(() => {
				const c = cloudCards[cloudSelectedIndex], m = document.getElementById("cloud-menu");
				if (c && m) m.scrollLeft = c.offsetLeft + c.offsetWidth / 2 - m.clientWidth / 2;
			});
		}

		function launchCloudGame(g) {
			if (!g) return;
			toggleCloudSettings(false);
			document.getElementById("cloud-menu").style.display = "none";
			document.getElementById("cloud-game").style.display = "flex";
			document.getElementById("cloud-back").style.display = "flex";
			document.getElementById("cloud-gear").style.display = "none";
			document.getElementById("cloud-frame").src = g.url;
			const ui = document.getElementById("cloud-ui");
			
			const hud = document.getElementById("cloud-hud");
			hud.classList.add("show");
			setTimeout(() => hud.classList.remove("show"), 2200);
		}

		function closeCloud() {
			showCloudMenu();
			toggleCloudSettings(false);
			document.getElementById("cloud-ui").classList.remove("open");
			cloudMatrixStop();
		}

		function openCloud() {
			const ui = document.getElementById("cloud-ui") || buildCloudUI();
			ui.classList.add("open");
			cpResize();
			cloudMatrixStart();
			if (!cpRaf) cpRaf = requestAnimationFrame(cpFrame);
		
			requestAnimationFrame(() => {
				const c = cloudCards[cloudSelectedIndex], m = document.getElementById("cloud-menu");
				if (c && m) m.scrollLeft = c.offsetLeft + c.offsetWidth / 2 - m.clientWidth / 2;
				selectCloudCard(cloudSelectedIndex, { scroll: false, focus: true });
			});
		}

		applyTitleColor(getTitleColorId());
	</script>

	<script>
		document.getElementById("csslink").href = `/assets/css/colors/${store.get("singularity_theme") ?? "default"}.css`;
	</script>

	<script>
		(function () {
			const ICONS = {
				home: '<path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
				gamepad: '<line x1="6" x2="10" y1="11" y2="11"/><line x1="8" x2="8" y1="9" y2="13"/><line x1="15" x2="15.01" y1="12" y2="12"/><line x1="18" x2="18.01" y1="10" y2="10"/><path d="M17.32 5H6.68a4 4 0 0 0-3.978 3.59c-.006.052-.01.101-.017.152C2.604 9.416 2 14.456 2 16a3 3 0 0 0 3 3c1 0 1.5-.5 2-1l1.414-1.414A2 2 0 0 1 9.828 16h4.344a2 2 0 0 1 1.414.586L17 18c.5.5 1 1 2 1a3 3 0 0 0 3-3c0-1.545-.604-6.584-.685-7.258-.007-.05-.011-.1-.017-.151A4 4 0 0 0 17.32 5z"/>',
				music: '<circle cx="8" cy="18" r="4"/><path d="M12 18V2l7 4"/>',
				chat: '<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>',
				bot: '<path d="M12 8V4H8"/><rect width="16" height="12" x="4" y="8" rx="2"/><path d="M2 14h2"/><path d="M20 14h2"/><path d="M15 13v2"/><path d="M9 13v2"/>',
				bag: '<path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/>',
				scroll: '<path d="M15 12h-5"/><path d="M15 8h-5"/><path d="M19 17V5a2 2 0 0 0-2-2H4"/><path d="M8 21h12a2 2 0 0 0 2-2v-1a1 1 0 0 0-1-1H11a1 1 0 0 0-1 1v1a2 2 0 1 1-4 0V5a2 2 0 1 0-4 0v2a1 1 0 0 0 1 1h3"/>',
				puzzle: '<path d="M15.39 4.39a1 1 0 0 0 1.68-.474 2.5 2.5 0 1 1 3.014 3.015 1 1 0 0 0-.474 1.68l1.683 1.682a2.414 2.414 0 0 1 0 3.414L19.61 15.39a1 1 0 0 1-1.68-.474 2.5 2.5 0 1 0-3.014 3.015 1 1 0 0 1 .474 1.68l-1.683 1.682a2.414 2.414 0 0 1-3.414 0L8.61 19.61a1 1 0 0 0-1.68.474 2.5 2.5 0 1 1-3.014-3.015 1 1 0 0 0 .474-1.68l-1.683-1.682a2.414 2.414 0 0 1 0-3.414L4.39 8.61a1 1 0 0 1 1.68.474 2.5 2.5 0 1 0 3.014-3.015 1 1 0 0 1-.474-1.68l1.683-1.682a2.414 2.414 0 0 1 3.414 0z"/>',
				sliders: '<line x1="21" x2="14" y1="4" y2="4"/><line x1="10" x2="3" y1="4" y2="4"/><line x1="21" x2="12" y1="12" y2="12"/><line x1="8" x2="3" y1="12" y2="12"/><line x1="21" x2="16" y1="20" y2="20"/><line x1="12" x2="3" y1="20" y2="20"/><line x1="14" x2="14" y1="2" y2="6"/><line x1="8" x2="8" y1="10" y2="14"/><line x1="16" x2="16" y1="18" y2="22"/>',
				globe: '<circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/>',
				plus: '<path d="M5 12h14"/><path d="M12 5v14"/>',
				film: '<rect width="18" height="18" x="3" y="3" rx="2"/><path d="M7 3v18"/><path d="M3 7.5h4"/><path d="M3 12h18"/><path d="M3 16.5h4"/><path d="M17 3v18"/><path d="M17 7.5h4"/><path d="M17 16.5h4"/>',
				appwindow: '<rect width="20" height="16" x="2" y="4" rx="2"/><path d="M10 4v4"/><path d="M2 8h20"/><path d="M6 4v4"/>',
				x: '<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
			};
			const svg = (name) => '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + ICONS[name] + '</svg>';

			const APPS = [
				{ key: "games", title: "Games", icon: "gamepad", urls: ["/pages/games.html", "/games.html"] },
				{ key: "browse", title: "Browser", icon: "appwindow", urls: ["/pages/browse.html", "/browse.html"] },
				{ key: "watch", title: "Movies", icon: "film", urls: ["/pages/watch.html", "/watch.html"] },
				{ key: "listen", title: "Music", icon: "music", urls: ["/pages/listen.html", "/listen.html"] },
				{ key: "chat", title: "Chat", icon: "chat", urls: ["/chat.html", "/pages/chat.html"] },
				{ key: "ai", title: "AI", icon: "bot", urls: ["/pages/ai.html", "/ai.html"] },
				{ key: "settings", title: "Settings", icon: "sliders", urls: ["/pages/settings.html", "/settings.html"] },
				{ key: "changelog", title: "Update Log", icon: "scroll", urls: [], builtin: "changelog" },
			];

			const CHANGELOG = [
				{
					date: "Oct 22, 2026",
					title: "New home and navigation",
					changes: [
						"New sidebar! for quick access to Games, Music, Chat and AI",
						"Tab system with an address bar and singularity:// links!",
						"more organized home screen",
					],
				},
				{
					date: "Oct 11, 2026",
					title: "Shop and daily spin",
					changes: [
						"Spin the wheel once a day to earn coins",
						"Spend coins on avatar decorations, profile effects and banners!!",
						"Equip your items from the shop or from Edit Profile",
					],
				},
			];

			function buildChangelog() {
				const wrap = document.createElement("div");
				wrap.className = "sg-cl";
				const inner = document.createElement("div");
				inner.className = "sg-cl-inner";
				inner.innerHTML = '<div class="sg-cl-kicker">CHANGELOG</div><h1 class="sg-cl-title">Update Log</h1><p class="sg-cl-sub">Sites Newest Updates</p>';
				CHANGELOG.forEach((e) => {
					const card = document.createElement("article");
					card.className = "sg-cl-card";
					const date = document.createElement("span");
					date.className = "sg-cl-date";
					date.textContent = e.date;
					const h = document.createElement("h2");
					h.textContent = e.title;
					const list = document.createElement("div");
					list.className = "sg-cl-list";
					e.changes.forEach((c) => {
						const p = document.createElement("p");
						p.textContent = c;
						list.appendChild(p);
					});
					card.append(date, h, list);
					inner.appendChild(card);
				});
				wrap.appendChild(inner);
				return wrap;
			}

			const tabsEl = document.getElementById("sg-tabs");
			const panesEl = document.getElementById("sg-panes");
			const railEl = document.getElementById("sg-rail");
			const addressEl = document.getElementById("sg-address");
			const backEl = document.getElementById("sg-back");
			const forwardEl = document.getElementById("sg-forward");

			const tabs = [{ id: "home", key: "home", appKey: "home", title: "Home", icon: null, letter: "H", pane: document.getElementById("sg-home"), frame: null, url: null, closable: false, stack: [], pos: -1 }];
			let activeId = "home";
			let seq = 0;

			const findApp = (key) => APPS.find((a) => a.key === key);
			const getTab = (id) => tabs.find((t) => t.id === id);

			function hostOf(u) {
				try { return new URL(u, location.href).hostname.replace(/^www\./, "") || u; } catch (e) { return u; }
			}
			function normalizeUrl(v) {
				v = (v || "").trim();
				if (!v) return null;
				if (/^[a-z][a-z0-9+.-]*:\/\//i.test(v)) return v;
				if (v.startsWith("/")) return v;
				if (/^[^\s/]+\.[^\s/]{2,}(\/\S*)?$/.test(v)) return "https://" + v;
				return null;
			}
			function displayFor(t) {
				if (t.id === "home") return "singularity://home";
				if (t.appKey) return "singularity://" + t.appKey;
				if (t.localName) return "singularity://" + t.localName;
				return t.url || "";
			}

			async function resolveUrl(app) {
				for (const u of app.urls) {
					try {
						const r = await fetch(u, { method: "HEAD" });
						if (r.ok) return u;
					} catch (e) {}
				}
				return app.urls[0];
			}

			function renderTabs() {
				tabsEl.innerHTML = "";
				tabs.forEach((t) => {
					const b = document.createElement("button");
					b.type = "button";
					b.className = "sg-tab" + (t.id === activeId ? " active" : "");
					b.setAttribute("role", "tab");
					b.setAttribute("aria-selected", t.id === activeId ? "true" : "false");
					const ico = document.createElement("span");
					ico.className = "sg-tab-ico";
					if (t.letter) ico.textContent = t.letter;
					else ico.innerHTML = svg(t.icon || "globe");
					const label = document.createElement("span");
					label.className = "sg-tab-title";
					label.textContent = t.title;
					b.append(ico, label);
					if (t.closable) {
						const x = document.createElement("span");
						x.className = "sg-tab-x";
						x.setAttribute("role", "button");
						x.setAttribute("aria-label", "Close tab");
						x.innerHTML = svg("x");
						x.addEventListener("click", (e) => { e.stopPropagation(); closeTab(t.id); });
						b.appendChild(x);
					}
					b.addEventListener("click", () => activateTab(t.id));
					b.addEventListener("auxclick", (e) => { if (e.button === 1 && t.closable) { e.preventDefault(); closeTab(t.id); } });
					tabsEl.appendChild(b);
					if (t.id === activeId) b.scrollIntoView({ inline: "nearest", block: "nearest" });
				});
				const cur = getTab(activeId);
				const openKeys = new Set(tabs.map((t) => t.appKey).filter(Boolean));
				railEl.querySelectorAll(".sg-rail-btn").forEach((b) => {
					const k = b.dataset.key;
					const isActive = !!cur && !!k && k === cur.appKey;
					b.classList.toggle("active", isActive);
					b.classList.toggle("open", !!k && k !== "home" && !isActive && openKeys.has(k));
				});
			}

			function updateToolbar() {
				const t = getTab(activeId);
				addressEl.value = displayFor(t);
				const noFrame = !t.frame || !t.url;
				backEl.disabled = noFrame;
				forwardEl.disabled = noFrame;
			}

			function activateTab(id) {
				if (!getTab(id)) return;
				const cloud = document.getElementById("cloud-ui");
				if (cloud && cloud.classList.contains("open")) closeCloud();
				activeId = id;
				tabs.forEach((t) => t.pane.classList.toggle("active", t.id === id));
				renderTabs();
				updateToolbar();
			}

			function closeTab(id) {
				const i = tabs.findIndex((t) => t.id === id);
				if (i < 1) return;
				const t = tabs[i];
				if (t.frame) t.frame.src = "about:blank";
				t.pane.remove();
				tabs.splice(i, 1);
				if (activeId === id) activateTab(tabs[i - 1].id);
				else renderTabs();
			}

			function createTab(def) {
				const pane = document.createElement("section");
				pane.className = "sg-pane";
				let frame = null;
				if (def.builtin) {
					pane.classList.add("sg-pane-builtin");
					pane.appendChild(buildChangelog());
				} else {
					frame = document.createElement("iframe");
					frame.className = "sg-frame";
					frame.title = def.title;
					frame.setAttribute("allow", "autoplay; fullscreen; clipboard-read; clipboard-write; gamepad; keyboard-map; pointer-lock");
					if (def.url) frame.src = def.url;
					pane.appendChild(frame);
				}
				panesEl.appendChild(pane);
				const t = {
					id: "t" + (++seq), key: def.key, appKey: def.appKey || null, title: def.title, icon: def.icon,
					pane, frame, url: def.url || null, closable: true, stack: def.url ? [def.url] : [], pos: def.url ? 0 : -1,
				};
				tabs.push(t);
				if (frame) frame.addEventListener("load", () => onFrameLoad(t));
				activateTab(t.id);
				return t;
			}

			function onFrameLoad(t) {
				let loc;
				try {
					loc = t.frame.contentWindow.location;
					if (!loc || loc.href === "about:blank") return;
				} catch (e) { return; }
				const full = loc.pathname + loc.hash;
				const app = APPS.find((a) => a.urls.includes(full)) || APPS.find((a) => a.urls.some((u) => u.split("#")[0] === loc.pathname));
				t.url = loc.href;
				if (app) {
					t.appKey = app.key;
					t.localName = null;
					t.title = app.title;
					t.icon = app.icon;
				} else {
					t.appKey = null;
					t.localName = loc.pathname.split("/").pop().replace(/\.html?$/i, "") || "index";
					let ttl = "";
					try { ttl = t.frame.contentDocument.title; } catch (e) {}
					t.title = ttl || t.localName;
				}
				renderTabs();
				if (t.id === activeId) updateToolbar();
			}

			function navigate(t, url, title, appKey, icon) {
				t.stack = t.stack.slice(0, t.pos + 1);
				t.stack.push(url);
				t.pos = t.stack.length - 1;
				t.url = url;
				t.appKey = appKey || null;
				t.localName = null;
				t.key = appKey || "url:" + url;
				t.title = title || hostOf(url);
				t.icon = icon || "globe";
				t.frame.src = url;
				renderTabs();
				updateToolbar();
			}

			async function openApp(key, url, title, icon) {
				const app = findApp(key);
				const k = app ? app.key : (key || "url:" + url);
				let t = tabs.find((x) => x.key === k);
				if (t) { activateTab(t.id); return; }
				if (app && app.builtin) {
					createTab({ key: app.key, appKey: app.key, title: app.title, icon: app.icon, builtin: app.builtin });
					return;
				}
				const u = app ? await resolveUrl(app) : url;
				if (!u) return;
				t = tabs.find((x) => x.key === k);
				if (t) { activateTab(t.id); return; }
				createTab({ key: k, appKey: app ? app.key : null, title: app ? app.title : (title || hostOf(u)), icon: app ? app.icon : (icon || "globe"), url: u });
			}

			async function goAddress(text) {
				const v = (text || "").trim();
				const cur = getTab(activeId);
				if (!v) { updateToolbar(); return; }
				const m = v.match(/^singularity:\/\/([^/]+)\/?$/i);
				if (m) {
					const k = m[1].toLowerCase();
					if (k === "home") { activateTab("home"); return; }
					const app = findApp(k);
					if (!app) { updateToolbar(); return; }
					const ex = tabs.find((t) => t.key === app.key);
					if (ex) { activateTab(ex.id); return; }
					if (app.builtin || !cur.frame || cur.url) openApp(k);
					else navigate(cur, await resolveUrl(app), app.title, app.key, app.icon);
					return;
				}
				const url = normalizeUrl(v);
				if (!url) { updateToolbar(); return; }
				if (!cur.frame) openApp("url:" + url, url);
				else navigate(cur, url, hostOf(url), null, "globe");
			}

			function newBlankTab() {
				createTab({ key: "new:" + (seq + 1), title: "New Tab", icon: "plus", url: null });
				addressEl.value = "";
				addressEl.focus();
			}

			backEl.addEventListener("click", () => {
				const t = getTab(activeId);
				if (!t.frame) return;
				try { t.frame.contentWindow.history.back(); return; } catch (e) {}
				if (t.pos > 0) { t.pos--; t.url = t.stack[t.pos]; t.frame.src = t.url; updateToolbar(); }
			});
			forwardEl.addEventListener("click", () => {
				const t = getTab(activeId);
				if (!t.frame) return;
				try { t.frame.contentWindow.history.forward(); return; } catch (e) {}
				if (t.pos < t.stack.length - 1) { t.pos++; t.url = t.stack[t.pos]; t.frame.src = t.url; updateToolbar(); }
			});
			document.getElementById("sg-reload").addEventListener("click", () => {
				const t = getTab(activeId);
				if (!t.frame || !t.url) return;
				try { t.frame.contentWindow.location.reload(); } catch (e) { t.frame.src = t.frame.src; }
			});
			document.getElementById("sg-new-tab").addEventListener("click", newBlankTab);
			addressEl.addEventListener("keydown", (e) => {
				if (e.key === "Enter") { goAddress(addressEl.value); addressEl.blur(); }
				if (e.key === "Escape") { updateToolbar(); addressEl.blur(); }
			});
			addressEl.addEventListener("focus", () => addressEl.select());

			window.sgHandle = function (msg) {
				if (!msg || typeof msg !== "object") return;
				if (msg.type === "nfs-open") {
					if (findApp(msg.key)) openApp(msg.key);
					else if (msg.url) openApp(msg.key, msg.url, msg.title, "gamepad");
				} else if (msg.type === "open-update-log") {
					openApp("changelog");
				}
			};
			window.addEventListener("message", (e) => {
				if (e.origin === location.origin) window.sgHandle(e.data);
			});

			const topGroup = document.createElement("div");
			topGroup.className = "sg-rail-group";
			railEl.append(topGroup);

			function railButton(group, icon, title, key, onClick) {
				const b = document.createElement("button");
				b.type = "button";
				b.className = "sg-rail-btn";
				b.title = title;
				b.setAttribute("aria-label", title);
				if (key) b.dataset.key = key;
				b.innerHTML = svg(icon);
				b.addEventListener("click", onClick);
				group.appendChild(b);
			}
			railButton(topGroup, "home", "Home", "home", () => activateTab("home"));
			["games", "browse", "watch", "listen", "chat", "ai"].forEach((k) => {
				const a = findApp(k);
				railButton(topGroup, a.icon, a.title, a.key, () => openApp(a.key));
			});
			railButton(topGroup, "scroll", "Update Log", "changelog", () => openApp("changelog"));
			railButton(topGroup, "puzzle", "Cloud", null, () => openCloud());
			railButton(topGroup, "sliders", "Settings", "settings", () => openApp("settings"));

			renderTabs();
			updateToolbar();
		})();
	</script>
