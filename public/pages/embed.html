<!doctype html>
<html lang="en">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Sail - Scramjet</title>

	<script src="/scram/scramjet.js"></script>
	<script src="/scram/controller/controller.api.js"></script>

	<link rel="stylesheet" href="/assets/css/colors/default.css" id="csslink" />
	<link rel="stylesheet" href="/assets/css/font.css?v=2" />
	<link rel="stylesheet" href="/assets/icons/css/all-pro.css" />
	<script src="https://cdnjs.cloudflare.com/ajax/libs/eruda/3.4.3/eruda.min.js"></script>
</head>
<style>
	html,
	body {
		margin: 0;
		width: 100%;
		height: 100%;
		overflow: hidden;
		background: linear-gradient(180deg, var(--bg) 0%, var(--bg-1) 100%);
	}

	#frame {
		position: fixed;
		inset: 0;
		width: 100vw;
		height: 100vh;
		border: 0;
	}

	.loadingthingy {
		position: fixed;
		left: 50%;
		top: 50%;
		transform: translate(-50%, -50%);
		width: min(320px, calc(100vw - 32px));
		padding: 16px 16px 14px;
		box-sizing: border-box;
		color: var(--bright-text);
		background: color-mix(in srgb, var(--bg-2) 88%, transparent);
		border: 1px solid var(--border-4);
		border-radius: 14px;
		box-shadow: 0 18px 40px rgba(0, 0, 0, 0.28);
		backdrop-filter: blur(16px);
		z-index: 5;
		transition: opacity 0.2s ease, transform 0.2s ease;
	}

	.loadingthingy.hidden {
		opacity: 0;
		transform: translate(-50%, calc(-50% + 8px));
		pointer-events: none;
	}

	.loadingthingy .toprow {
		display: flex;
		align-items: center;
		gap: 12px;
	}

	.loadingthingy .copy {
		min-width: 0;
	}

	.loadingthingy h1 {
		margin: 0 0 4px 0;
		font-size: 18px;
		line-height: 1.1;
	}

	.loadingthingy p {
		margin: 0;
		font-size: 13px;
		line-height: 1.35;
		color: var(--text);
		opacity: 0.82;
	}

	.spinner {
		width: 28px;
		height: 28px;
		flex: 0 0 auto;
		border-radius: 50%;
		border: 3px solid color-mix(in srgb, var(--border-4) 76%, transparent);
		border-top-color: var(--accent);
		animation: spin 0.8s linear infinite;
	}

	.statusline {
		display: flex;
		align-items: center;
		gap: 8px;
		margin-top: 12px;
		font-size: 12px;
		color: var(--text);
		opacity: 0.8;
	}

	.statusdot {
		width: 7px;
		height: 7px;
		border-radius: 999px;
		background: var(--accent);
		box-shadow: 0 0 0 6px color-mix(in srgb, var(--accent) 14%, transparent);
		animation: pulse 1.25s ease-in-out infinite;
	}

	.progress {
		width: 100%;
		position: relative;
		height: 4px;
		background: var(--bg-3);
		border-radius: 8px;
		margin-top: 14px;
		overflow: hidden;
	}

	.progress .inner {
		position: absolute;
		inset: 0 auto 0 0;
		width: 42%;
		border-radius: 8px;
		background: linear-gradient(90deg, var(--accent), color-mix(in srgb, var(--accent) 45%, white));
		animation: progressLoop 1.1s infinite linear;
	}

	@keyframes spin {
		from {
			transform: rotate(0deg);
		}

		to {
			transform: rotate(360deg);
		}
	}

	@keyframes progressLoop {
		0% {
			transform: translateX(-110%);
		}

		100% {
			transform: translateX(340%);
		}
	}

	@keyframes pulse {

		0%,
		100% {
			transform: scale(1);
			opacity: 1;
		}

		50% {
			transform: scale(0.88);
			opacity: 0.72;
		}
	}
</style>

<body class="obfuscate">
	<iframe src="" sandbox="allow-forms allow-pointer-lock allow-same-origin allow-scripts allow-downloads"
		frameborder="0" id="frame"></iframe>

	<div class="loadingthingy" id="loadingthingy">
		<div class="toprow">
			<div class="spinner" aria-hidden="true"></div>
			<div class="copy">
				<h1>Loading...</h1>
				<p>This might take a bit.</p>
			</div>
		</div>
		<div class="statusline">
			<div class="statusdot" aria-hidden="true"></div>
			<span id="loading-status">Setting up transport...</span>
		</div>
		<div class="progress">
			<div class="inner"></div>
		</div>
	</div>

	<script type="module">
		const params = new URLSearchParams(window.location.search);
		const frame = document.getElementById("frame");
		const loadingThingy = document.getElementById("loadingthingy");
		const loadingStatus = document.getElementById("loading-status");
		const link = params.get("link");
		const defaultWispUrl =
			(window.location.protocol === "https:" ? "wss://" : "ws://") +
			window.location.host +
			"/socket/";
		const wispUrl = defaultWispUrl;

		const SCRAM_PATHS = {
			scramjetPath: "/scram/scramjet.js",
			wasmPath: "/scram/scramjet.wasm",
			injectPath: "/scram/controller/controller.inject.js",
		};

		function setLoadingStatus(message) {
			loadingStatus.textContent = message;
		}

		function showFailure(message) {
			console.error(message);
			setLoadingStatus(message);
			const h1 = loadingThingy.querySelector("h1");
			if (h1) h1.textContent = "Couldn't load";
		}

		function hideLoader() {
			loadingThingy.classList.add("hidden");
			setTimeout(() => {
				loadingThingy.style.display = "none";
			}, 220);
		}

		let navigated = false;
		frame.addEventListener("load", () => {
			if (navigated) hideLoader();
		});

		function normalizeLink(raw) {
			let url = raw.trim();
			if (!url.includes(".")) {
				url = "https://duckduckgo.com/?q=" + encodeURIComponent(url);
			} else if (!url.startsWith("http://") && !url.startsWith("https://")) {
				url = "https://" + url;
			}
			return url;
		}

		async function loadTransportClass(selectedTransport) {
			const path = selectedTransport === "epoxy" ? "/epoxy/index.mjs" : "/libcurl/index.mjs";
			try {
				return (await import(path)).default;
			} catch (e) {
				throw new Error("Could not load " + path + ":(");
			}
		}

		async function startScramjet() {
			const sjCtl = globalThis.$scramjetController;
			const sj = globalThis.$scramjet;
			if (!sjCtl || !sj) {
				throw new Error(
					"Scramjet scripts did not load.",
				);
			}
			const { Controller } = sjCtl;
			const { defaultConfig } = sj;

			setLoadingStatus("Loading Scramjet...");
			await navigator.serviceWorker.register("/sw.js");
			const registration = await navigator.serviceWorker.ready;
			const serviceworker = navigator.serviceWorker.controller || registration.active;

			setLoadingStatus("Setting up transport...");
			const selectedTransport = localStorage.getItem("singularity_transport") || "libcurl";
			const TransportClass = await loadTransportClass(selectedTransport);
			const transport = new TransportClass(
				selectedTransport === "epoxy" ? { wisp: wispUrl } : { websocket: wispUrl },
			);
			await transport.init();

			const controller = new Controller({
				serviceworker,
				transport,
				scramjetConfig: { ...defaultConfig, ...SCRAM_PATHS },
			});
			await controller.wait();

			if (!link) {
				hideLoader();
				return;
			}

			setLoadingStatus("Loading the page...");
			const sjFrame = controller.createFrame(frame);
			navigated = true;
			sjFrame.go(normalizeLink(link));
		}

		startScramjet().catch((e) =>
			showFailure(e && e.message ? e.message : String(e)),
		);
	</script>
	<script>
		document.getElementById("csslink").href =
			`/assets/css/colors/${localStorage.getItem("singularity_theme") ?? "default"}.css`;
	</script>
	<script>
		window.addEventListener("keydown", (e) => {
			if (e.altKey && e.code === "KeyG") {
				parent.postMessage({ type: "alt-g" }, "*");
			}
		});
	</script>
</body>

</html>
