
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abyss</title>
    <script src="/assets/js/adblock.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css">
    <style>
        :root {
            --ps-bg: #0b0c10;
            --ps-card: rgba(20, 20, 25, 0.7);
            --ps-blue: #8b5cf6;
            --ps-glow: rgba(139, 92, 246, 0.6);
            --text-main: #f0f0f0;
            --text-muted: #888891;
            --glass-border: rgba(255, 255, 255, 0.08);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; user-select: none; }

        body {
            background-color: var(--ps-bg);
            color: var(--text-main);
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        #particle-canvas {
            position: fixed;
            inset: 0;
            z-index: 2;
            pointer-events: none;
        }

        #boot-screen {
            position: fixed; inset: 0;
            background: radial-gradient(circle at center, #111 0%, #000 100%);
            z-index: 9999;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            transition: opacity 1.2s ease, visibility 1.2s;
        }
        .boot-logo-container { position: relative; display: flex; flex-direction: column; align-items: center; }
        .boot-logo {
            font-size: 4.5rem; font-weight: 300; letter-spacing: 6px;
            color: #fff; display: flex; align-items: center; gap: 20px;
            opacity: 0; transform: scale(0.8);
            animation: cinematicPop 2.5s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }
        .boot-logo i { color: var(--ps-blue); text-shadow: 0 0 20px var(--ps-glow); }
        .boot-line {
            position: relative;
            margin-top: 30px; width: 200px; height: 2px; background: var(--ps-blue);
            box-shadow: 0 0 15px var(--ps-blue); border-radius: 2px;
            transform-origin: center; transform: scaleX(0);
            animation: lineExpand 2s cubic-bezier(0.8, 0, 0.2, 1) 0.5s forwards;
        }
        @keyframes cinematicPop {
            0% { opacity: 0; transform: scale(0.8) translateY(30px); filter: blur(15px); }
            40% { opacity: 1; transform: scale(1.05) translateY(0); filter: blur(0px); text-shadow: 0 0 40px rgba(255,255,255,0.6); }
            100% { opacity: 1; transform: scale(1) translateY(0); text-shadow: 0 0 15px rgba(255,255,255,0.2); }
        }
        @keyframes lineExpand {
            0% { transform: scaleX(0); opacity: 1; }
            50% { transform: scaleX(1); opacity: 0.8; }
            100% { transform: scaleX(0); opacity: 0; }
        }

        #app {
            width: 100%; height: 100%;
            display: flex; flex-direction: column; position: relative;
            background: var(--ps-bg);
        }
        #app::before {
            content: ''; position: absolute; inset: 0;
            background: radial-gradient(circle at top, rgba(0,0,0,0.2) 0%, #000 95%);
            z-index: 1; pointer-events: none;
        }

        .top-bar {
            height: 100px; display: flex; justify-content: space-between; align-items: center;
            padding: 0 50px; z-index: 20; position: relative; flex-shrink: 0;
        }
        .tabs { display: flex; gap: 40px; align-items: center; margin-left: 20px; }
        .tab {
            font-size: 16px; color: white;
            padding: 8px 0; position: relative; font-weight: 500;
        }
        .tab::after {
            content: ''; position: absolute; bottom: -5px; left: 0; width: 100%; height: 2px;
            background: white;
        }

        .sys-icons { display: flex; gap: 25px; color: white; font-size: 18px; align-items: center; opacity: 0.8; }
        .sys-icons span { font-size: 14px; font-weight: bold; margin-left: -10px; }
        #settings-btn {
            cursor: pointer;
            transition: transform 0.4s ease, color 0.3s, text-shadow 0.3s;
        }
        #settings-btn:hover {
            color: var(--ps-blue);
            transform: scale(1.25) rotate(180deg);
            text-shadow: 0 0 12px var(--ps-glow);
        }

        #settings-modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(12px);
            z-index: 5000;
            justify-content: center;
            align-items: center;
        }
        .settings-box {
            background: rgba(20, 20, 25, 0.95);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 40px 50px;
            min-width: 340px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.6);
            text-align: center;
        }
        .settings-box h2 {
            font-weight: 300;
            font-size: 24px;
            margin-bottom: 30px;
            letter-spacing: 1px;
        }
        .settings-options {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .settings-option {
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--glass-border);
            border-radius: 14px;
            padding: 16px 24px;
            color: white;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.25s;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }   
    .settings-option:hover {
    background: rgba(255, 255, 255, 0.1);
    border-color: rgba(255, 255, 255, 0.25);
    transform: translateY(-2px);
}
.settings-option.active {
    background: rgba(255, 255, 255, 0.15);
    border-color: rgba(255, 255, 255, 0.4);
    box-shadow: none;
}
        .settings-option i {
            font-size: 18px;
            opacity: 0.7;
        }
        .settings-close {
            margin-top: 28px;
            background: transparent;
            border: 1px solid var(--glass-border);
            color: var(--text-muted);
            padding: 10px 28px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 14px;
            transition: 0.25s;
        }
        .settings-close:hover {
            border-color: white;
            color: white;
        }

        #content-area {
            flex: 1; position: relative; z-index: 10;
            display: flex; flex-direction: column; min-height: 0;
            overflow-y: auto; overflow-x: hidden;
        }

        .games-page-wrap {
            width: 92%;
            max-width: 1600px;
            margin: 0 auto;
            box-sizing: border-box;
            padding: 20px 0 80px 0;
            position: relative;
            z-index: 5;
        }

        .section-label {
            width: 100%;
            text-align: center;
            justify-content: center;
            color: var(--text-main);
            font-size: 18px;
            font-weight: 700;
            letter-spacing: -0.3px;
            margin: 24px 0 12px 4px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .section-divider {
            width: 100%;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin-bottom: 10px;
        }
        .home-game-card {
            width: 230px;
            border-radius: 16px;
            overflow: hidden;
            background: var(--ps-card);
            border: 1px solid var(--glass-border);
            cursor: pointer;
            display: flex;
            flex-direction: column;
            transition: 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        .home-game-card.is-hidden { display: none; }
        .home-game-card:hover {
            transform: translateY(-6px);
            border-color: var(--ps-blue);
            box-shadow: 0 15px 35px rgba(0,0,0,0.5), 0 0 20px var(--ps-glow);
        }
        .home-game-card .card-img-wrap {
            position: relative;
            width: 100%;
            height: 140px;
            overflow: hidden;
            background: rgba(255,255,255,0.03);
        }
        .home-game-card .card-img-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .home-game-card .card-info {
            padding: 12px 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .home-game-card .card-info h3 {
            font-size: 14px;
            font-weight: 600;
            color: white;
            margin: 0;
        }
        .fav-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 0;
            color: var(--text-muted);
            opacity: 0.6;
            transition: 0.2s;
            font-size: 14px;
        }
        .fav-btn:hover { opacity: 1; transform: scale(1.15); }
        .fav-btn.active { color: #f5c542; opacity: 1; }

        .games-controls {
            display: flex;
            gap: 14px;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            margin: 24px 0 40px 0;
        }
        .games-controls input[type="text"] {
            width: 500px !important;
            max-width: 90vw;
            height: 56px !important;
            font-size: 16px;
            background: var(--ps-card);
            border: 1px solid var(--glass-border);
            color: white;
            border-radius: 16px;
            padding: 0 24px;
            outline: none;
            transition: 0.3s;
        }
        .games-controls input[type="text"]:focus {
            border-color: var(--ps-blue);
            box-shadow: 0 0 30px var(--ps-glow);
        }
        .games-controls input[type="text"]::placeholder {
            color: var(--text-muted);
        }

        #game-container {
            width: 100%;
            margin: 0 auto;
            min-height: 400px;
        }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 10px; }
    </style>
    <script>
        if (navigator.geolocation) {
            const denyGeo = (error) => {
                if (typeof error === 'function') {
                    error({
                        code: 1,
                        message: 'Geolocation blocked by Abyss',
                        PERMISSION_DENIED: 1,
                        POSITION_UNAVAILABLE: 2,
                        TIMEOUT: 3
                    });
                }
            };
            navigator.geolocation.getCurrentPosition = function(success, error) { denyGeo(error); };
            navigator.geolocation.watchPosition = function(success, error) { denyGeo(error); return -1; };
            navigator.geolocation.clearWatch = function() {};
        }
    </script>
</head>
<body>

    <canvas id="particle-canvas"></canvas>

    <div id="boot-screen">
        <div class="boot-logo-container">
            <div class="boot-logo"><i class="fab fa-xbox"></i> ABYSS</div>
            <div class="boot-line"></div>
        </div>
    </div>

    <div id="settings-modal">
        <div class="settings-box">
            <h2>Background Effects</h2>
            <div class="settings-options">
                <div class="settings-option" data-effect="snow" onclick="setEffect('snow')">
                    <span>Snow</span>
                    <i class="fas fa-snowflake"></i>
                </div>
                <div class="settings-option" data-effect="rain" onclick="setEffect('rain')">
                    <span>Rain</span>
                    <i class="fas fa-cloud-rain"></i>
                </div>
                <div class="settings-option" data-effect="dots" onclick="setEffect('dots')">
                    <span>Dots</span>
                    <i class="fas fa-circle"></i>
                </div>
                <div class="settings-option" data-effect="none" onclick="setEffect('none')">
                    <span>None</span>
                    <i class="fas fa-ban"></i>
                </div>
            </div>
            
            <button class="settings-close" onclick="closeSettings()">Close</button>
        </div>
    </div>

    <div id="app">
        <div class="top-bar">
            <div class="tabs">
                <div class="tab active">Home</div>
            </div>
            <div class="sys-icons">
                <i class="fas fa-cog" id="settings-btn" onclick="openSettings()" title="Settings"></i>
                <i class="fas fa-user-circle" style="font-size: 24px; margin-left: 5px;"></i>
                <span id="clock">12:00</span>
            </div>
        </div>

        <div id="content-area">
            <div class="games-page-wrap">

                <div class="games-controls" style="position: relative; justify-content: center;">
                    <input type="text" id="game-search" placeholder="Search for a game...">
                </div>

                <div id="game-container"></div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/luminsdk/script@latest/lumin.min.js"></script>
    <script src="/assets/js/singularity.loader.js?v=20260919a"></script>

    <script>
        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        let currentEffect = localStorage.getItem('abyss_effect') || 'rain';
        let animId = null;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function createParticles(type) {
            particles = [];
            const count = type === 'rain' ? 120 : type === 'snow' ? 80 : 60;

            for (let i = 0; i < count; i++) {
                particles.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    size: type === 'rain' ? Math.random() * 1.5 + 0.5 : Math.random() * 3 + 1,
                    speedY: type === 'rain' ? Math.random() * 8 + 6 : type === 'snow' ? Math.random() * 1.5 + 0.5 : Math.random() * 2 + 0.8,
                    speedX: type === 'snow' ? (Math.random() - 0.5) * 1.2 : type === 'rain' ? 0 : (Math.random() - 0.5) * 0.5,
                    opacity: Math.random() * 0.6 + 0.3
                });
            }
        }

        function drawParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if (currentEffect === 'none') return;

            particles.forEach(p => {
                if (currentEffect === 'rain') {
                    ctx.beginPath();
                    ctx.fillStyle = `rgba(255, 255, 255, ${p.opacity})`;
                    ctx.fillRect(p.x, p.y, 1.5, p.size * 6);
                } else if (currentEffect === 'snow') {
                    ctx.save();
                    ctx.translate(p.x, p.y);
                    ctx.rotate((270 * Math.PI) / 180);
                    ctx.font = `900 ${p.size * 6}px "Font Awesome 6 Free"`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillStyle = `rgba(0, 210, 255, ${p.opacity})`;
                    ctx.fillText('\uf2dc', 0, 0);
                    ctx.restore();
                } else if (currentEffect === 'dots') {
                    ctx.beginPath();
                    ctx.fillStyle = `rgba(255, 255, 255, ${p.opacity})`;
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fill();
                }

                p.y += p.speedY;
                p.x += p.speedX;

                if (p.y > canvas.height) {
                    p.y = -10;
                    p.x = Math.random() * canvas.width;
                }
                if (p.x > canvas.width) p.x = 0;
                if (p.x < 0) p.x = canvas.width;
            });
        }

        function animate() {
            drawParticles();
            animId = requestAnimationFrame(animate);
        }

        function setEffect(type) {
            currentEffect = type;
            localStorage.setItem('abyss_effect', type);

            document.querySelectorAll('.settings-option').forEach(el => {
                el.classList.toggle('active', el.dataset.effect === type);
            });

            if (type === 'none') {
                particles = [];
                ctx.clearRect(0, 0, canvas.width, canvas.height);
            } else {
                createParticles(type);
            }
            closeSettings();
        }

        function openSettings() {
            document.getElementById('settings-modal').style.display = 'flex';
            document.querySelectorAll('.settings-option').forEach(el => {
                el.classList.toggle('active', el.dataset.effect === currentEffect);
            });
            updateAdBlockUI();
        }

        function closeSettings() {
            document.getElementById('settings-modal').style.display = 'none';
        }

        document.getElementById('settings-modal').addEventListener('click', (e) => {
            if (e.target.id === 'settings-modal') closeSettings();
        });

        function updateAdBlockUI() {
            const toggle = document.getElementById('adblock-toggle');
            const label = document.getElementById('adblock-label');
            if (!toggle) return;
            const enabled = window.__adblock.isEnabled();
            toggle.classList.toggle('active', enabled);
            label.textContent = enabled ? 'Blocking ads' : 'Ad blocker off';
        }

        function toggleAdBlock() {
            window.__adblock.setEnabled(!window.__adblock.isEnabled());
            updateAdBlockUI();
        }
        const gameSearchInput = document.getElementById('game-search');
        const gameContainer = document.getElementById('game-container');
        if (gameSearchInput && gameContainer) {
            gameSearchInput.addEventListener('input', () => {
                const q = gameSearchInput.value.trim().toLowerCase();
                gameContainer.querySelectorAll('.home-game-card').forEach(card => {
                    const titleEl = card.querySelector('.card-info h3');
                    const title = titleEl ? titleEl.textContent.toLowerCase() : '';
                    card.classList.toggle('is-hidden', q.length > 0 && !title.includes(q));
                });
            });
        }

        window.onload = function() {
            if (currentEffect !== 'none') {
                createParticles(currentEffect);
            }
            animate();

            setTimeout(() => {
                document.getElementById('boot-screen').style.opacity = '0';
                setTimeout(() => {
                    document.getElementById('boot-screen').style.visibility = 'hidden';
                }, 1200);
            }, 2500);

            setInterval(() => {
                document.getElementById('clock').innerText = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
            }, 1000);
            document.getElementById('clock').innerText = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
        };

    </script>
</body>
</html>
